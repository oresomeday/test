<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IWBTG ENGINE</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { 
    background: #000; 
    overflow: hidden; 
    width: 100%; 
    height: 100%; 
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
}
#gameContainer {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
}
#gameArea {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
    position: relative;
}
canvas#game { 
    display: block;
    background: #000;
}
#touchControls {
    display: none;
    height: 140px;
    min-height: 120px;
    max-height: 160px;
    background: linear-gradient(to bottom, #1a1a2e, #0a0a15);
    position: relative;
    flex-shrink: 0;
}
#touchCanvas {
    width: 100%;
    height: 100%;
}
#menuButton {
    display: none;
    position: absolute;
    top: 5px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: 2px solid rgba(255,255,255,0.3);
    padding: 8px 20px;
    font-size: 12px;
    font-family: monospace;
    border-radius: 20px;
    z-index: 50;
    cursor: pointer;
    backdrop-filter: blur(5px);
}
#menuButton:active {
    background: rgba(255,255,255,0.3);
}
#optionsOverlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.95); z-index: 200; color: #fff; font-family: monospace; overflow-y: auto;
}
#optionsContent { max-width: 600px; margin: 20px auto; padding: 20px; }
#optionsContent h2 { color: #ff4444; margin-bottom: 20px; text-align: center; }
.key-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; padding: 10px; background: #222; border-radius: 5px; }
.key-row label { color: #aaa; }
.key-btn { background: #444; color: #fff; border: 2px solid #666; padding: 10px 20px; min-width: 120px; cursor: pointer; font-family: monospace; font-size: 14px; border-radius: 5px; transition: all 0.2s; }
.key-btn:hover { background: #555; border-color: #888; }
.key-btn.listening { background: #ff4444; border-color: #ff6666; animation: pulse 0.5s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
.options-btn { background: #0088ff; color: #fff; border: none; padding: 15px 30px; margin: 10px; cursor: pointer; font-family: monospace; font-size: 16px; border-radius: 5px; }
.options-btn:hover { background: #00aaff; }
.options-btn.reset { background: #ff4444; }
.options-btn.reset:hover { background: #ff6666; }
#optionsButtons { text-align: center; margin-top: 30px; }
.section-title { color: #ffcc00; margin: 30px 0 15px 0; padding-bottom: 5px; border-bottom: 1px solid #444; }

#fullscreenBtn {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(135deg, #ff4444, #ff0000);
    color: #fff;
    border: 4px solid #fff;
    padding: 40px 80px;
    font-size: 28px;
    font-family: monospace;
    border-radius: 15px;
    z-index: 1000;
    cursor: pointer;
    box-shadow: 0 0 50px rgba(255,0,0,0.5), inset 0 0 30px rgba(255,255,255,0.2);
    animation: btnPulse 1.5s infinite;
}
@keyframes btnPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 50px rgba(255,0,0,0.5); }
    50% { transform: translate(-50%, -50%) scale(1.05); box-shadow: 0 0 80px rgba(255,0,0,0.8); }
}
</style>
</head>
<body>
<button id="fullscreenBtn">▶ TAP TO START ▶<br><small>タップしてスタート</small></button>
<div id="gameContainer">
    <div id="gameArea">
        <canvas id="game"></canvas>
        <button id="menuButton">☰ MENU</button>
    </div>
    <div id="touchControls">
        <canvas id="touchCanvas"></canvas>
    </div>
</div>
<div id="optionsOverlay">
    <div id="optionsContent">
        <h2>⚙ KEY CONFIGURATION ⚙</h2>
        <div class="section-title">MOVEMENT</div>
        <div class="key-row"><label>Move Left</label><button class="key-btn" data-action="left">ArrowLeft</button></div>
        <div class="key-row"><label>Move Right</label><button class="key-btn" data-action="right">ArrowRight</button></div>
        <div class="section-title">ACTIONS</div>
        <div class="key-row"><label>Jump</label><button class="key-btn" data-action="jump">Space</button></div>
        <div class="key-row"><label>Jump (Alt 1)</label><button class="key-btn" data-action="jump2">KeyZ</button></div>
        <div class="key-row"><label>Jump (Alt 2)</label><button class="key-btn" data-action="jump3">ArrowUp</button></div>
        <div class="key-row"><label>Dash</label><button class="key-btn" data-action="dash">KeyX</button></div>
        <div class="key-row"><label>Dash (Alt)</label><button class="key-btn" data-action="dash2">ShiftLeft</button></div>
        <div class="section-title">SYSTEM</div>
        <div class="key-row"><label>Restart Stage</label><button class="key-btn" data-action="restart">KeyR</button></div>
        <div class="key-row"><label>Confirm / Start</label><button class="key-btn" data-action="confirm">Enter</button></div>
        <div id="optionsButtons">
            <button class="options-btn reset" onclick="resetKeyBindings()">Reset to Default</button>
            <button class="options-btn" onclick="closeOptions()">Save & Close</button>
        </div>
    </div>
</div>

<script>
// ============================================================
//  ENGINE CORE
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const touchCanvas = document.getElementById('touchCanvas');
const touchCtx = touchCanvas.getContext('2d');
const touchControls = document.getElementById('touchControls');
const optionsOverlay = document.getElementById('optionsOverlay');
const gameContainer = document.getElementById('gameContainer');
const gameArea = document.getElementById('gameArea');
const fullscreenBtn = document.getElementById('fullscreenBtn');
const menuButton = document.getElementById('menuButton');

const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
const gameWidth = 800;
const gameHeight = 600;

// ============================================================
//  FULLSCREEN & SCREEN MANAGEMENT
// ============================================================
let isFullscreen = false;
let gameStarted = false;

function requestFullscreen() {
    const elem = document.documentElement;
    if (elem.requestFullscreen) {
        elem.requestFullscreen();
    } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
    } else if (elem.mozRequestFullScreen) {
        elem.mozRequestFullScreen();
    } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
    }
    if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
    }
}

function setupMobileFullscreen() {
    if (isTouchDevice) {
        fullscreenBtn.style.display = 'block';
        const startGame = (e) => {
            e.preventDefault();
            requestFullscreen();
            fullscreenBtn.style.display = 'none';
            isFullscreen = true;
            gameStarted = true;
            resizeCanvas();
        };
        fullscreenBtn.addEventListener('click', startGame);
        fullscreenBtn.addEventListener('touchstart', startGame);
    } else {
        gameStarted = true;
    }
}

// Menu button
menuButton.addEventListener('click', () => {
    if (gameState === 'playing' || gameState === 'dead') {
        gameState = 'title';
        currentLevel = 0;
    }
});
menuButton.addEventListener('touchstart', (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (gameState === 'playing' || gameState === 'dead') {
        gameState = 'title';
        currentLevel = 0;
    }
});

document.addEventListener('fullscreenchange', () => {
    isFullscreen = !!document.fullscreenElement;
    resizeCanvas();
});

function resizeCanvas() {
    const windowW = window.innerWidth;
    const windowH = window.innerHeight;
    
    if (isTouchDevice && gameStarted) {
        touchControls.style.display = 'block';
        menuButton.style.display = 'block';
        
        // Fixed control height
        const controlHeight = Math.min(140, Math.max(100, windowH * 0.18));
        touchControls.style.height = controlHeight + 'px';
        touchControls.style.minHeight = controlHeight + 'px';
        touchControls.style.maxHeight = controlHeight + 'px';
        
        touchCanvas.width = windowW;
        touchCanvas.height = controlHeight;
        
        // Game area uses ALL remaining space
        const gameAreaHeight = windowH - controlHeight;
        
        // Fill the entire game area
        const ratio = gameWidth / gameHeight;
        let canvasW, canvasH;
        
        if (windowW / gameAreaHeight > ratio) {
            // Height limited - fill height
            canvasH = gameAreaHeight;
            canvasW = gameAreaHeight * ratio;
        } else {
            // Width limited - fill width
            canvasW = windowW;
            canvasH = windowW / ratio;
        }
        
        canvas.width = gameWidth;
        canvas.height = gameHeight;
        canvas.style.width = canvasW + 'px';
        canvas.style.height = canvasH + 'px';
        
        updateButtonPositions();
    } else if (isTouchDevice && !gameStarted) {
        touchControls.style.display = 'none';
        menuButton.style.display = 'none';
    } else {
        // Desktop
        touchControls.style.display = 'none';
        menuButton.style.display = 'none';
        const ratio = gameWidth / gameHeight;
        let canvasW, canvasH;
        
        if (windowW / windowH > ratio) {
            canvasH = windowH;
            canvasW = windowH * ratio;
        } else {
            canvasW = windowW;
            canvasH = windowW / ratio;
        }
        
        canvas.width = gameWidth;
        canvas.height = gameHeight;
        canvas.style.width = canvasW + 'px';
        canvas.style.height = canvasH + 'px';
    }
}

window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => {
    setTimeout(resizeCanvas, 100);
});

// --- Key Bindings ---
const defaultKeyBindings = {
    left:'ArrowLeft', right:'ArrowRight',
    jump:'Space', jump2:'KeyZ', jump3:'ArrowUp',
    dash:'KeyX', dash2:'ShiftLeft',
    restart:'KeyR', confirm:'Enter'
};
let keyBindings = { ...defaultKeyBindings };

function loadKeyBindings() {
    const s = localStorage.getItem('iwbtg_keybindings');
    if (s) { try { keyBindings = { ...defaultKeyBindings, ...JSON.parse(s) }; } catch(e) { keyBindings = { ...defaultKeyBindings }; } }
    updateKeyButtons();
}
function saveKeyBindings() { localStorage.setItem('iwbtg_keybindings', JSON.stringify(keyBindings)); }
function resetKeyBindings() { keyBindings = { ...defaultKeyBindings }; saveKeyBindings(); updateKeyButtons(); }
function updateKeyButtons() {
    document.querySelectorAll('.key-btn').forEach(btn => {
        const a = btn.dataset.action; if (keyBindings[a]) btn.textContent = formatKeyName(keyBindings[a]);
    });
}
function formatKeyName(c) { return c.replace('Key','').replace('Arrow','').replace('Shift','Shift ').replace('Left','L').replace('Right','R'); }

// --- Options ---
let listeningButton = null;
function openOptions() { optionsOverlay.style.display = 'block'; gameState = 'options'; }
function closeOptions() {
    optionsOverlay.style.display = 'none';
    if (currentLevel === 0 && !player.dead) gameState = 'title';
    else if (gameState === 'options') gameState = 'playing';
    saveKeyBindings();
}
document.querySelectorAll('.key-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        if (listeningButton) listeningButton.classList.remove('listening');
        listeningButton = this; this.classList.add('listening'); this.textContent = 'Press a key...';
    });
});
document.addEventListener('keydown', function(e) {
    if (listeningButton) {
        e.preventDefault(); keyBindings[listeningButton.dataset.action] = e.code;
        listeningButton.textContent = formatKeyName(e.code);
        listeningButton.classList.remove('listening'); listeningButton = null;
    }
});

// ============================================================
//  TOUCH CONTROLS (IMPROVED - BUTTONS SEPARATED)
// ============================================================
const touchState = { 
    stick: { active: false, id: null, startX: 0, startY: 0, dx: 0, dy: 0 }, 
    jump: false, 
    dash: false,
    jumpId: null,
    dashId: null
};

let stickConfig = { x: 80, y: 70, baseRadius: 45, stickRadius: 28, maxDist: 35 };
let buttonConfig = {
    jump: { x: 0, y: 0, radius: 40, label: 'JUMP', color: '#00aa00' },
    dash: { x: 0, y: 0, radius: 32, label: 'DASH', color: '#0088ff' }
};

function updateButtonPositions() {
    const w = touchCanvas.width;
    const h = touchCanvas.height;
    
    // Left side: analog stick
    stickConfig.x = Math.max(70, w * 0.12);
    stickConfig.y = h / 2;
    stickConfig.baseRadius = Math.min(45, h * 0.38);
    stickConfig.stickRadius = stickConfig.baseRadius * 0.6;
    stickConfig.maxDist = stickConfig.baseRadius * 0.75;
    
    // Right side: buttons - MORE SEPARATED
    const buttonAreaStart = w * 0.6;
    const buttonAreaWidth = w * 0.4;
    
    // Dash button on the left of button area
    buttonConfig.dash.x = buttonAreaStart + buttonAreaWidth * 0.25;
    buttonConfig.dash.y = h / 2;
    buttonConfig.dash.radius = Math.min(32, h * 0.26);
    
    // Jump button on the right of button area (bigger)
    buttonConfig.jump.x = buttonAreaStart + buttonAreaWidth * 0.72;
    buttonConfig.jump.y = h / 2;
    buttonConfig.jump.radius = Math.min(42, h * 0.34);
}

function handleTouchStart(e) {
    e.preventDefault();
    const rect = touchCanvas.getBoundingClientRect();
    
    for (let t of e.changedTouches) {
        const x = t.clientX - rect.left;
        const y = t.clientY - rect.top;
        
        // Left half: stick
        if (x < touchCanvas.width * 0.4 && !touchState.stick.active) {
            touchState.stick.active = true;
            touchState.stick.id = t.identifier;
            touchState.stick.startX = x;
            touchState.stick.startY = y;
            updateStickDelta(x, y);
        }
        
        // Jump button
        const jumpDist = Math.sqrt((x - buttonConfig.jump.x) ** 2 + (y - buttonConfig.jump.y) ** 2);
        if (jumpDist < buttonConfig.jump.radius + 15) {
            touchState.jump = true;
            touchState.jumpId = t.identifier;
        }
        
        // Dash button
        const dashDist = Math.sqrt((x - buttonConfig.dash.x) ** 2 + (y - buttonConfig.dash.y) ** 2);
        if (dashDist < buttonConfig.dash.radius + 15) {
            touchState.dash = true;
            touchState.dashId = t.identifier;
        }
    }
}

function handleTouchMove(e) {
    e.preventDefault();
    const rect = touchCanvas.getBoundingClientRect();
    
    for (let t of e.changedTouches) {
        if (t.identifier === touchState.stick.id) {
            updateStickDelta(t.clientX - rect.left, t.clientY - rect.top);
        }
    }
}

function handleTouchEnd(e) {
    e.preventDefault();
    
    for (let t of e.changedTouches) {
        if (t.identifier === touchState.stick.id) {
            touchState.stick.active = false;
            touchState.stick.id = null;
            touchState.stick.dx = 0;
            touchState.stick.dy = 0;
        }
        if (t.identifier === touchState.jumpId) {
            touchState.jump = false;
            touchState.jumpId = null;
        }
        if (t.identifier === touchState.dashId) {
            touchState.dash = false;
            touchState.dashId = null;
        }
    }
}

function updateStickDelta(x, y) {
    let dx = x - stickConfig.x;
    let dy = y - stickConfig.y;
    const d = Math.sqrt(dx * dx + dy * dy);
    
    if (d > stickConfig.maxDist) {
        dx = (dx / d) * stickConfig.maxDist;
        dy = (dy / d) * stickConfig.maxDist;
    }
    
    touchState.stick.dx = dx / stickConfig.maxDist;
    touchState.stick.dy = dy / stickConfig.maxDist;
}

if (isTouchDevice) {
    touchCanvas.addEventListener('touchstart', handleTouchStart, { passive: false });
    touchCanvas.addEventListener('touchmove', handleTouchMove, { passive: false });
    touchCanvas.addEventListener('touchend', handleTouchEnd, { passive: false });
    touchCanvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });
}

function drawTouchControls() {
    if (!isTouchDevice || !gameStarted) return;
    
    touchCtx.clearRect(0, 0, touchCanvas.width, touchCanvas.height);
    
    // Background gradient
    const bgGrad = touchCtx.createLinearGradient(0, 0, 0, touchCanvas.height);
    bgGrad.addColorStop(0, '#1a1a2e');
    bgGrad.addColorStop(1, '#0a0a15');
    touchCtx.fillStyle = bgGrad;
    touchCtx.fillRect(0, 0, touchCanvas.width, touchCanvas.height);
    
    // Top border glow
    const topGlow = touchCtx.createLinearGradient(0, 0, 0, 5);
    topGlow.addColorStop(0, 'rgba(100,100,150,0.5)');
    topGlow.addColorStop(1, 'transparent');
    touchCtx.fillStyle = topGlow;
    touchCtx.fillRect(0, 0, touchCanvas.width, 5);
    
    // Draw analog stick base
    const g = touchCtx.createRadialGradient(
        stickConfig.x, stickConfig.y, 0,
        stickConfig.x, stickConfig.y, stickConfig.baseRadius
    );
    g.addColorStop(0, '#3a3a4a');
    g.addColorStop(0.6, '#2a2a3a');
    g.addColorStop(1, '#1a1a2a');
    
    touchCtx.beginPath();
    touchCtx.arc(stickConfig.x, stickConfig.y, stickConfig.baseRadius, 0, Math.PI * 2);
    touchCtx.fillStyle = g;
    touchCtx.fill();
    touchCtx.strokeStyle = '#4a4a5a';
    touchCtx.lineWidth = 3;
    touchCtx.stroke();
    
    // Draw stick knob
    const kx = stickConfig.x + touchState.stick.dx * stickConfig.maxDist;
    const ky = stickConfig.y + touchState.stick.dy * stickConfig.maxDist;
    
    // Shadow
    touchCtx.beginPath();
    touchCtx.arc(kx + 2, ky + 2, stickConfig.stickRadius, 0, Math.PI * 2);
    touchCtx.fillStyle = 'rgba(0,0,0,0.4)';
    touchCtx.fill();
    
    // Knob gradient
    const kg = touchCtx.createRadialGradient(
        kx - 8, ky - 8, 0,
        kx, ky, stickConfig.stickRadius
    );
    kg.addColorStop(0, touchState.stick.active ? '#aaa' : '#777');
    kg.addColorStop(0.5, touchState.stick.active ? '#777' : '#555');
    kg.addColorStop(1, touchState.stick.active ? '#555' : '#333');
    
    touchCtx.beginPath();
    touchCtx.arc(kx, ky, stickConfig.stickRadius, 0, Math.PI * 2);
    touchCtx.fillStyle = kg;
    touchCtx.fill();
    touchCtx.strokeStyle = touchState.stick.active ? '#bbb' : '#666';
    touchCtx.lineWidth = 2;
    touchCtx.stroke();
    
    // Direction indicators
    touchCtx.fillStyle = '#666';
    touchCtx.font = `bold ${Math.max(10, stickConfig.baseRadius * 0.25)}px sans-serif`;
    touchCtx.textAlign = 'center';
    touchCtx.textBaseline = 'middle';
    touchCtx.fillText('◀', stickConfig.x - stickConfig.baseRadius + 12, stickConfig.y);
    touchCtx.fillText('▶', stickConfig.x + stickConfig.baseRadius - 12, stickConfig.y);
    
    // Draw buttons - with labels below
    drawTouchButton(buttonConfig.dash, touchState.dash);
    drawTouchButton(buttonConfig.jump, touchState.jump);
}

function drawTouchButton(cfg, pressed) {
    const { x, y, radius: r, label, color } = cfg;
    
    // Shadow
    touchCtx.beginPath();
    touchCtx.arc(x + 2, y + 2, r, 0, Math.PI * 2);
    touchCtx.fillStyle = 'rgba(0,0,0,0.4)';
    touchCtx.fill();
    
    // Button gradient
    const g = touchCtx.createRadialGradient(x - r / 3, y - r / 3, 0, x, y, r);
    if (pressed) {
        g.addColorStop(0, lightenColor(color, 50));
        g.addColorStop(0.5, lightenColor(color, 20));
        g.addColorStop(1, color);
    } else {
        g.addColorStop(0, lightenColor(color, 30));
        g.addColorStop(0.6, color);
        g.addColorStop(1, darkenColor(color, 30));
    }
    
    touchCtx.beginPath();
    touchCtx.arc(x, y, r, 0, Math.PI * 2);
    touchCtx.fillStyle = g;
    touchCtx.fill();
    
    // Border
    touchCtx.strokeStyle = pressed ? '#fff' : 'rgba(255,255,255,0.4)';
    touchCtx.lineWidth = pressed ? 3 : 2;
    touchCtx.stroke();
    
    // Glow when pressed
    if (pressed) {
        touchCtx.shadowColor = color;
        touchCtx.shadowBlur = 15;
        touchCtx.beginPath();
        touchCtx.arc(x, y, r, 0, Math.PI * 2);
        touchCtx.stroke();
        touchCtx.shadowBlur = 0;
    }
    
    // Label
    touchCtx.fillStyle = pressed ? '#fff' : '#eee';
    touchCtx.font = `bold ${Math.max(10, r / 2.5)}px monospace`;
    touchCtx.textAlign = 'center';
    touchCtx.textBaseline = 'middle';
    touchCtx.fillText(label, x, y);
}

function lightenColor(c, p) {
    const n = parseInt(c.replace('#', ''), 16);
    const a = Math.round(2.55 * p);
    return '#' + (0x1000000 + Math.min(255, (n >> 16) + a) * 0x10000 + Math.min(255, ((n >> 8) & 0xFF) + a) * 0x100 + Math.min(255, (n & 0xFF) + a)).toString(16).slice(1);
}

function darkenColor(c, p) {
    const n = parseInt(c.replace('#', ''), 16);
    const a = Math.round(2.55 * p);
    return '#' + (0x1000000 + Math.max(0, (n >> 16) - a) * 0x10000 + Math.max(0, ((n >> 8) & 0xFF) - a) * 0x100 + Math.max(0, (n & 0xFF) - a)).toString(16).slice(1);
}

// ============================================================
//  SAVE SYSTEM
// ============================================================
let saveData = {
    clearedStages: [],
    bestDeaths: {},
    totalDeaths: 0,
    lastStage: 0,
    totalClears: 0
};

function loadSaveData() {
    const s = localStorage.getItem('iwbtg_savedata');
    if (s) {
        try {
            const loaded = JSON.parse(s);
            saveData = { ...saveData, ...loaded };
        } catch (e) {
            console.log('Save data corrupted, starting fresh');
        }
    }
}

function saveSaveData() {
    localStorage.setItem('iwbtg_savedata', JSON.stringify(saveData));
}

function clearStage(stageIndex) {
    if (!saveData.clearedStages.includes(stageIndex)) {
        saveData.clearedStages.push(stageIndex);
    }
    
    const currentDeaths = deathCount - (stageDeathStart || 0);
    if (saveData.bestDeaths[stageIndex] === undefined || currentDeaths < saveData.bestDeaths[stageIndex]) {
        saveData.bestDeaths[stageIndex] = currentDeaths;
    }
    
    saveData.lastStage = stageIndex + 1;
    saveSaveData();
}

function autoSave() {
    saveData.totalDeaths = totalDeathCount;
    saveData.lastStage = currentLevel;
    saveSaveData();
}

function resetAllSaveData() {
    saveData = {
        clearedStages: [],
        bestDeaths: {},
        totalDeaths: 0,
        lastStage: 0,
        totalClears: 0
    };
    saveSaveData();
}

// ============================================================
//  GAME STATE
// ============================================================
let gameState = 'title';
let deathCount = 0;
let totalDeathCount = 0;
let stageDeathStart = 0;
let currentLevel = 0;
let screenShake = 0;
let deathTimer = 0;
let clearTimer = 0;
let gameTime = 0;
let slowMotion = 1;
let flashEffect = 0;
let stageSelectCursor = 0;
let stageSelectScroll = 0;
let titleParticles = [];
let titleFlares = [];

// Initialize title effects
function initTitleEffects() {
    titleParticles = [];
    titleFlares = [];
    for (let i = 0; i < 150; i++) {
        titleParticles.push({

// --- Input ---
document.addEventListener('keydown', e => {
    if (listeningButton) return;
    if (!keys[e.code]) keysPressed[e.code] = true;
    keys[e.code] = true;
    
    if (e.code === 'Escape') {
        if (gameState === 'options') closeOptions();
        else if (gameState === 'stageselect') gameState = 'title';
        else if (gameState === 'title' || gameState === 'playing') openOptions();
        e.preventDefault();
        return;
    }
    
    handleMenuInput(e.code);
    e.preventDefault();
});

document.addEventListener('keyup', e => { keys[e.code] = false; });

function handleMenuInput(code) {
    const isConfirm = code === keyBindings.confirm || code === keyBindings.jump || code === keyBindings.jump2;
    const isUp = code === 'ArrowUp';
    const isDown = code === 'ArrowDown';
    const isLeft = code === 'ArrowLeft';
    const isRight = code === 'ArrowRight';
    
    if (gameState === 'title') {
        if (isConfirm) {
            gameState = 'stageselect';
            stageSelectCursor = saveData.lastStage || 0;
        }
    } else if (gameState === 'stageselect') {
        if (isUp) stageSelectCursor = Math.max(0, stageSelectCursor - 1);
        if (isDown) stageSelectCursor = Math.min(levels.length - 1, stageSelectCursor + 1);
        if (isLeft) stageSelectCursor = Math.max(0, stageSelectCursor - 10);
        if (isRight) stageSelectCursor = Math.min(levels.length - 1, stageSelectCursor + 10);
        
        if (isConfirm) {
            if (stageSelectCursor === 0 || saveData.clearedStages.includes(stageSelectCursor - 1)) {
                currentLevel = stageSelectCursor;
                deathCount = 0;
                stageDeathStart = totalDeathCount;
                gameState = 'playing';
                resetLevel();
            }
        }
    } else if (gameState === 'dead' && deathTimer > 30) {
        if (isConfirm) {
            gameState = 'playing';
            resetLevel();
        }
    } else if (gameState === 'clear' && clearTimer > 60) {
        if (isConfirm) {
            currentLevel++;
            if (currentLevel >= levels.length) {
                gameState = 'gameclear';
                saveData.totalClears++;
                saveSaveData();
                clearTimer = 0;
            } else {
                stageDeathStart = totalDeathCount;
                gameState = 'playing';
                resetLevel();
            }
        }
    } else if (gameState === 'gameclear' && clearTimer > 120) {
        if (isConfirm) {
            gameState = 'title';
            currentLevel = 0;
            deathCount = 0;
        }
    }
    
    if (code === keyBindings.restart && (gameState === 'playing' || gameState === 'dead')) {
        gameState = 'playing';
        resetLevel();
    }
}

// Touch input for menus
if (isTouchDevice) {
    canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const scaleX = gameWidth / rect.width;
        const scaleY = gameHeight / rect.height;
        
        for (let t of e.changedTouches) {
            const x = (t.clientX - rect.left) * scaleX;
            const y = (t.clientY - rect.top) * scaleY;
            
            handleTouchMenu(x, y);
        }
    }, { passive: false });
}

function handleTouchMenu(x, y) {
    if (gameState === 'title') {
        gameState = 'stageselect';
        stageSelectCursor = saveData.lastStage || 0;
    } else if (gameState === 'stageselect') {
        const startY = 120;
        const itemHeight = 35;
        const visible = Math.floor((600 - startY - 50) / itemHeight);
        
        for (let i = 0; i < visible; i++) {
            const idx = stageSelectScroll + i;
            if (idx >= levels.length) break;
            
            const itemY = startY + i * itemHeight;
            if (y >= itemY && y < itemY + itemHeight && x >= 100 && x <= 700) {
                if (stageSelectCursor === idx) {
                    if (idx === 0 || saveData.clearedStages.includes(idx - 1)) {
                        currentLevel = idx;
                        deathCount = 0;
                        stageDeathStart = totalDeathCount;
                        gameState = 'playing';
                        resetLevel();
                    }
                } else {
                    stageSelectCursor = idx;
                }
                return;
            }
        }
        
        if (y > 550 && x < 150) {
            gameState = 'title';
        }
    } else if (gameState === 'dead' && deathTimer > 30) {
        gameState = 'playing';
        resetLevel();
    } else if (gameState === 'clear' && clearTimer > 60) {
        currentLevel++;
        if (currentLevel >= levels.length) {
            gameState = 'gameclear';
            saveData.totalClears++;
            saveSaveData();
            clearTimer = 0;
        } else {
            stageDeathStart = totalDeathCount;
            gameState = 'playing';
            resetLevel();
        }
    } else if (gameState === 'gameclear' && clearTimer > 120) {
        gameState = 'title';
        currentLevel = 0;
        deathCount = 0;
    }
}

function isActionPressed(a) {
    switch (a) {
        case 'left': return (isTouchDevice && touchState.stick.dx < -0.3) || keys[keyBindings.left];
        case 'right': return (isTouchDevice && touchState.stick.dx > 0.3) || keys[keyBindings.right];
        case 'jump': return (isTouchDevice && touchState.jump) || keys[keyBindings.jump] || keys[keyBindings.jump2] || keys[keyBindings.jump3];
        case 'dash': return (isTouchDevice && touchState.dash) || keys[keyBindings.dash] || keys[keyBindings.dash2];
    }
    return false;
}

function isActionJustPressed(a) {
    switch (a) {
        case 'dash':
            if (isTouchDevice && touchState.dash && !prevTouchDash) return true;
            return keysPressed[keyBindings.dash] || keysPressed[keyBindings.dash2];
        case 'jump':
            if (isTouchDevice && touchState.jump && !prevTouchJump) return true;
            return keysPressed[keyBindings.jump] || keysPressed[keyBindings.jump2] || keysPressed[keyBindings.jump3];
    }
    return false;
}

function clearKeysPressed() { keysPressed = {}; }

// ============================================================
//  COLLISION
// ============================================================
function rectCollision(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// ============================================================
//  UPDATE
// ============================================================
function update() {
    gameTime++;
    
    // Update title particles
    if (gameState === 'title') {
        for (const p of titleParticles) {
            p.x += p.vx;
            p.y += p.vy;
            p.life++;
            if (p.x < 0 || p.x > 800) p.vx *= -1;
            if (p.y < 0 || p.y > 600) p.vy *= -1;
        }
    }
    
    if (slowMotion < 1) slowMotion = Math.min(1, slowMotion + 0.02);
    
    if (gameState === 'dead') {
        deathTimer++;
        updateParticles();
        return;
    }
    
    if (gameState === 'clear' || gameState === 'gameclear') {
        clearTimer++;
        updateParticles();
        return;
    }
    
    if (gameState !== 'playing') return;
    
    const lvl = levels[currentLevel];
    if (!lvl) return;
    
    // Trail
    if (Math.abs(player.vx) > 0 || Math.abs(player.vy) > 2) {
        trailParticles.push({
            x: player.x + player.w / 2,
            y: player.y + player.h / 2,
            size: player.dashing ? 8 : 4,
            life: player.dashing ? 15 : 8,
            color: player.dashing ? '#00ffff' : '#ffffff44'
        });
    }
    
    if (player.invincible > 0) player.invincible--;
    if (player.dashCooldown > 0) player.dashCooldown--;
    
    // Movement
    if (!player.dashing) {
        player.vx = 0;
        if (isActionPressed('left')) { player.vx = -player.speed; player.facing = -1; }
        if (isActionPressed('right')) { player.vx = player.speed; player.facing = 1; }
    }
    
    // Dash
    if (isActionJustPressed('dash') && player.dashCooldown <= 0 && !player.dashing) {
        player.dashing = true;
        player.dashTime = 8;
        player.dashCooldown = 45;
        player.vx = player.facing * 15;
        player.vy = 0;
        player.invincible = 10;
        
        for (let i = 0; i < 10; i++) {
            particles.push({
                x: player.x + player.w / 2,
                y: player.y + player.h / 2,
                vx: -player.facing * (Math.random() * 5 + 2),
                vy: (Math.random() - 0.5) * 3,
                life: 15,
                size: 3 + Math.random() * 3,
                color: '#00ffff',
                gravity: 0
            });
        }
    }
    
    if (player.dashing) {
        player.dashTime--;
        if (player.dashTime <= 0) {
            player.dashing = false;
            player.vx = player.facing * player.speed * 0.5;
        }
    }
    
    // Jump
    const jumpKey = isActionPressed('jump');
    if (jumpKey && !player.jumpHeld) {
        if (player.onGround) {
            player.vy = player.jumpForce;
            player.onGround = false;
            for (let i = 0; i < 5; i++) {
                particles.push({
                    x: player.x + player.w / 2 + (Math.random() - 0.5) * 10,
                    y: player.y + player.h,
                    vx: (Math.random() - 0.5) * 3,
                    vy: Math.random() * 2,
                    life: 15,
                    size: 2 + Math.random() * 2,
                    color: '#888',
                    gravity: 0.1
                });
            }
        } else if (player.doubleJump) {
            player.vy = player.jumpForce * 0.9;
            player.doubleJump = false;
            for (let i = 0; i < 8; i++) {
                const a = (i / 8) * Math.PI * 2;
                particles.push({
                    x: player.x + player.w / 2,
                    y: player.y + player.h / 2,
                    vx: Math.cos(a) * 3,
                    vy: Math.sin(a) * 3,
                    life: 20,
                    size: 3,
                    color: '#88ff88',
                    gravity: 0
                });
            }
        }
        player.jumpHeld = true;
    }
    if (!jumpKey) player.jumpHeld = false;
    if (!jumpKey && player.vy < -2 && !player.dashing) player.vy = -2;
    if (!player.dashing) {
        player.vy += 0.5;
        if (player.vy > 14) player.vy = 14;
    }
    
    // Horizontal collision
    player.x += player.vx * slowMotion;
    const allPlatforms = [...lvl.platforms];
    
    for (const p of allPlatforms) {
        if (rectCollision(player, p)) {
            if (player.vx > 0) player.x = p.x - player.w;
            else if (player.vx < 0) player.x = p.x + p.w;
            if (player.dashing) player.dashing = false;
        }
    }
    
    // Vertical collision
    player.y += player.vy * slowMotion;
    player.onGround = false;
    
    for (const p of allPlatforms) {
        if (rectCollision(player, p)) {
            if (player.vy > 0) {
                player.y = p.y - player.h;
                player.vy = 0;
                player.onGround = true;
                player.doubleJump = true;
            } else if (player.vy < 0) {
                player.y = p.y + p.h;
                player.vy = 0;
            }
        }
    }
    
    if (Math.abs(player.vx) > 0.1) player.runFrame += 0.3;
    else player.runFrame = 0;
    
    // Boundary death
    if (player.y > 650 || player.x < -50 || player.x > 850 || player.y < -100) {
        killPlayer();
        clearKeysPressed();
        return;
    }
    
    // Exit check
    if (rectCollision(player, { x: lvl.exitX, y: lvl.exitY, w: 30, h: 36 })) {
        clearStage(currentLevel);
        gameState = 'clear';
        clearTimer = 0;
        
        for (let i = 0; i < 100; i++) {
            particles.push({
                x: player.x + player.w / 2,
                y: player.y + player.h / 2,
                vx: (Math.random() - 0.5) * 15,
                vy: (Math.random() - 0.5) * 15,
                life: 100 + Math.random() * 50,
                size: 2 + Math.random() * 6,
                color: ['#ff0', '#0ff', '#f0f', '#0f0', '#f80', '#fff'][Math.floor(Math.random() * 6)],
                gravity: 0.02
            });
        }
    }
    
    if (screenShake > 0) screenShake *= 0.9;
    if (flashEffect > 0) flashEffect--;
    
    updateParticles();
    prevTouchJump = touchState.jump;
    prevTouchDash = touchState.dash;
    clearKeysPressed();
}

function updateParticles() {
    for (let i = bloodParticles.length - 1; i >= 0; i--) {
        const p = bloodParticles[i];
        p.x += p.vx * slowMotion;
        p.y += p.vy * slowMotion;
        p.vy += p.gravity * slowMotion;
        p.vx *= 0.99;
        p.life--;
        if (p.life <= 0) bloodParticles.splice(i, 1);
    }
    
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity || 0;
        p.vx *= 0.98;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    for (let i = sparkParticles.length - 1; i >= 0; i--) {
        const p = sparkParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.9;
        p.vy *= 0.9;
        p.life--;
        if (p.life <= 0) sparkParticles.splice(i, 1);
    }
    
    for (let i = textParticles.length - 1; i >= 0; i--) {
        const p = textParticles[i];
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) textParticles.splice(i, 1);
    }
    
    for (let i = trailParticles.length - 1; i >= 0; i--) {
        const p = trailParticles[i];
        p.life--;
        p.size *= 0.9;
        if (p.life <= 0) trailParticles.splice(i, 1);
    }
    
    for (const s of backgroundStars) {
        s.twinkle += 0.05;
        s.y += s.speed;
        if (s.y > 600) { s.y = 0; s.x = Math.random() * 800; }
    }
}

// ============================================================
//  DRAW
// ============================================================
function draw() {
    const sx = canvas.width / gameWidth;
    const sy = canvas.height / gameHeight;
    ctx.save();
    ctx.scale(sx, sy);
    
    if (screenShake > 0.5) {
        ctx.translate(
            (Math.random() - 0.5) * screenShake * 2,
            (Math.random() - 0.5) * screenShake * 2
        );
    }
    
    const lvl = levels[currentLevel] || levels[0];
    const g = ctx.createLinearGradient(0, 0, 0, 600);
    g.addColorStop(0, lvl.bgColor || '#0a0a1a');
    g.addColorStop(1, '#000010');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 800, 600);
    
    // Stars
    for (const s of backgroundStars) {
        ctx.fillStyle = `rgba(255,255,255,${0.3 + Math.sin(s.twinkle) * 0.3})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
    }
    
    if (gameState === 'title') { drawTitle(); ctx.restore(); drawTouchControls(); return; }
    if (gameState === 'stageselect') { drawStageSelect(); ctx.restore(); drawTouchControls(); return; }
    if (gameState === 'gameclear') { drawGameClear(); ctx.restore(); drawTouchControls(); return; }
    
    // Grid
    ctx.strokeStyle = 'rgba(255,255,255,0.02)';
    for (let i = 0; i < 800; i += 32) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 600); ctx.stroke();
    }
    for (let i = 0; i < 600; i += 32) {
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(800, i); ctx.stroke();
    }
    
    // Trails
    for (const p of trailParticles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / 15;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    
    // Platforms
    for (const p of lvl.platforms) drawPlatform(p);
    
    // Exit
    drawExit(lvl.exitX, lvl.exitY);
    
    // Player
    if (!player.dead) drawPlayer();
    
    // Blood
    for (const p of bloodParticles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.min(1, p.life / 30);
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    
    // Particles
    for (const p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.min(1, p.life / 30);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    
    // Sparks
    for (const p of sparkParticles) {
        ctx.strokeStyle = p.color;
        ctx.globalAlpha = p.life / 20;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 3, p.y - p.vy * 3);
        ctx.stroke();
    }
    ctx.globalAlpha = 1;
    
    // Text particles
    for (const p of textParticles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.min(1, p.life / 20);
        ctx.font = `bold ${p.size}px monospace`;
        ctx.textAlign = 'center';
        ctx.shadowColor = '#000';
        ctx.shadowBlur = 4;
        ctx.fillText(p.text, p.x, p.y);
        ctx.shadowBlur = 0;
        ctx.textAlign = 'left';
    }
    ctx.globalAlpha = 1;
    
    // Flash
    if (flashEffect > 0) {
        ctx.fillStyle = `rgba(255,255,255,${flashEffect / 20})`;
        ctx.fillRect(0, 0, 800, 600);
    }
    
    drawHUD();
    
    if (gameState === 'dead') drawDeathScreen();
    if (gameState === 'clear') drawStageClear();
    
    ctx.restore();
    drawTouchControls();
}

function drawPlatform(p) {
    const type = p.type || 'stone';
    let c1, c2, c3;
    
    switch (type) {
        case 'grass': c1 = '#3d5c3d'; c2 = '#2d4c2d'; c3 = '#4d6c4d'; break;
        case 'stone': c1 = '#555'; c2 = '#444'; c3 = '#666'; break;
        case 'metal': c1 = '#667788'; c2 = '#556677'; c3 = '#778899'; break;
        case 'gold': c1 = '#aa8833'; c2 = '#997722'; c3 = '#bbaa44'; break;
        case 'crystal': c1 = '#4466aa'; c2 = '#335599'; c3 = '#5577bb'; break;
        default: c1 = '#555'; c2 = '#444'; c3 = '#666';
    }
    
    ctx.fillStyle = c1;
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = c3;
    ctx.fillRect(p.x, p.y, p.w, 3);
    ctx.strokeStyle = c2;
    ctx.lineWidth = 1;
    for (let x = p.x; x < p.x + p.w; x += 16) {
        ctx.beginPath();
        ctx.moveTo(x, p.y);
        ctx.lineTo(x, p.y + p.h);
        ctx.stroke();
    }
    ctx.strokeStyle = '#222';
    ctx.strokeRect(p.x, p.y, p.w, p.h);
    
    if (type === 'gold' || type === 'crystal') {
        const t = gameTime * 0.1;
        for (let i = 0; i < 3; i++) {
            ctx.fillStyle = type === 'gold' ? 'rgba(255,255,200,0.8)' : 'rgba(200,220,255,0.8)';
            ctx.beginPath();
            ctx.arc(
                p.x + ((t * 20 + i * p.w / 3) % p.w),
                p.y + Math.sin(t + i) * 3 + p.h / 2,
                2, 0, Math.PI * 2
            );
            ctx.fill();
        }
    }
}

function drawExit(x, y) {
    const t = gameTime * 0.05;
    
    for (let i = 3; i >= 0; i--) {
        ctx.fillStyle = `rgba(0,${255 - i * 30},${255 - i * 30},${0.2 - i * 0.04})`;
        ctx.beginPath();
        ctx.arc(x + 15, y + 18, 20 + i * 8 + Math.sin(t + i) * 3, 0, Math.PI * 2);
        ctx.fill();
    }
    
    const glow = Math.sin(t * 2) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(0,255,255,${glow})`;
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.moveTo(x + 15, y);
    ctx.lineTo(x + 30, y + 18);
    ctx.lineTo(x + 22, y + 18);
    ctx.lineTo(x + 22, y + 36);
    ctx.lineTo(x + 8, y + 36);
    ctx.lineTo(x + 8, y + 18);
    ctx.lineTo(x, y + 18);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
}

function drawPlayer() {
    const px = player.x, py = player.y, f = player.facing;
    const bobY = player.onGround ? Math.sin(player.runFrame) * 2 : 0;
    
    ctx.save();
    ctx.translate(px + player.w / 2, py + player.h / 2);
    if (player.dashing) { ctx.globalAlpha = 0.8; ctx.scale(1.5, 0.7); }
    ctx.translate(-(px + player.w / 2), -(py + player.h / 2));
    
    if (player.invincible > 0 && Math.floor(player.invincible / 3) % 2 === 0) ctx.globalAlpha = 0.5;
    
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(px + player.w / 2, py + player.h + 2, 8, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Cape
    const cw = Math.sin(gameTime * 0.15) * 3;
    ctx.fillStyle = '#cc0000';
    ctx.beginPath();
    ctx.moveTo(px + (f > 0 ? 2 : 14), py + 6 + bobY);
    ctx.quadraticCurveTo(px + (f > 0 ? -8 : 24), py + 12 + cw + bobY, px + (f > 0 ? -4 : 20), py + 20 + cw + bobY);
    ctx.lineTo(px + (f > 0 ? 2 : 14), py + 18 + bobY);
    ctx.fill();
    
    // Body
    ctx.fillStyle = '#ff6688';
    ctx.fillRect(px + 2, py + 6 + bobY, 12, 10);
    
    // Head
    ctx.fillStyle = '#ffccbb';
    ctx.fillRect(px + 2, py + bobY, 12, 8);
    
    // Hair
    ctx.fillStyle = '#553322';
    ctx.fillRect(px + 2, py + bobY, 12, 3);
    
    // Eyes
    ctx.fillStyle = '#fff';
    ctx.fillRect(px + (f > 0 ? 8 : 4), py + 3 + bobY, 5, 4);
    ctx.fillStyle = '#000';
    ctx.fillRect(px + (f > 0 ? 10 : 4), py + 4 + bobY, 2, 2);
    
    // Legs
    const l1 = player.onGround ? Math.sin(player.runFrame) * 3 : 2;
    const l2 = player.onGround ? Math.sin(player.runFrame + Math.PI) * 3 : -2;
    ctx.fillStyle = '#4444ff';
    ctx.fillRect(px + 3 + l1, py + 15 + bobY, 4, 5);
    ctx.fillRect(px + 9 + l2, py + 15 + bobY, 4, 5);
    
    // Gun
    ctx.fillStyle = '#666';
    ctx.fillRect(px + (f > 0 ? 12 : -4), py + 9 + bobY, 8, 4);
    
    ctx.restore();
}

function drawHUD() {

    // Total deaths
    ctx.fillStyle = '#888';
    ctx.font = '10px monospace';
    ctx.fillText(`Total: ${totalDeathCount}`, 10, 38);
    
    // Stage info

    ctx.font = '12px monospace';
    ctx.fillText(`STAGE ${currentLevel + 1}/${levels.length}`, 10, 55);
    
    // Difficulty
    ctx.fillStyle = diff.color;
    ctx.font = 'bold 12px monospace';
    ctx.fillText(diff.name, 10, 72);
    
    // Stage name

    ctx.font = 'bold 14px monospace';
    ctx.fillText(lvl.name, 10, 90);

    }
    ctx.fillStyle = '#888';
    ctx.font = '10px monospace';
    ctx.fillText('DASH', 740, 30);

    ctx.fillStyle = player.doubleJump ? '#88ff88' : '#444';
    ctx.fillRect(740, 40, 50, 8);
    ctx.fillStyle = '#888';
    ctx.fillText('2JUMP', 740, 60);
    
    if (!isTouchDevice) {
        ctx.fillStyle = '#666';
        ctx.font = '10px monospace';
        ctx.fillText('ESC: Options', 740, 80);
    }
    
    // Message
    if (lvl.messages && lvl.messages[0]) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 570, 800, 30);
        ctx.fillStyle = '#fff';
        ctx.font = '13px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(lvl.messages[0], 400, 590);
        ctx.textAlign = 'left';
    }
}

function drawTitle() {
    const t = gameTime * 0.02;
    
    // Animated background
    const bgGrad = ctx.createRadialGradient(400, 300, 0, 400, 300, 500);
    bgGrad.addColorStop(0, `hsl(${(t * 20) % 360}, 50%, 10%)`);
    bgGrad.addColorStop(0.5, '#0a0a1a');
    bgGrad.addColorStop(1, '#000');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, 800, 600);
    
    // Light flares
    for (const f of titleFlares) {
        const flareAlpha = 0.03 + Math.sin(t * f.speed + f.phase) * 0.02;
        const flareGrad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.size);
        flareGrad.addColorStop(0, `rgba(255, 100, 100, ${flareAlpha})`);
        flareGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = flareGrad;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // Floating particles with trails
    for (const p of titleParticles) {
        const hue = (p.hue + t * 30) % 360;
        const alpha = 0.3 + Math.sin(p.life * 0.05) * 0.2;
        
        // Glow
        ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;
        ctx.shadowBlur = 10;
        ctx.fillStyle = `hsla(${hue}, 100%, 60%, ${alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
    
    // Lightning effects
    if (Math.random() < 0.02) {
        ctx.strokeStyle = `rgba(255,255,255,${0.3 + Math.random() * 0.3})`;
        ctx.lineWidth = 1 + Math.random() * 2;
        ctx.beginPath();
        let lx = Math.random() * 800;
        let ly = 0;
        ctx.moveTo(lx, ly);
        while (ly < 600) {
            lx += (Math.random() - 0.5) * 50;
            ly += Math.random() * 30 + 10;
            ctx.lineTo(lx, ly);
        }
        ctx.stroke();
    }
    
    ctx.textAlign = 'center';
    
    // Main title with multiple layers
    const titleY = 140;
    
    // Title shadow/glow layers
    for (let i = 5; i >= 0; i--) {
        ctx.save();
        ctx.translate(400, titleY);
        ctx.rotate(Math.sin(t * 0.5 + i * 0.1) * 0.02);
        ctx.scale(1 + i * 0.02, 1 + i * 0.02);
        
        if (i > 0) {
            ctx.fillStyle = `rgba(255, 0, 0, ${0.15 - i * 0.02})`;
            ctx.shadowColor = '#ff0000';
            ctx.shadowBlur = 20 + i * 10;
        } else {
            // Main title
            const titleGrad = ctx.createLinearGradient(-200, -20, 200, 20);
            titleGrad.addColorStop(0, '#ff0000');
            titleGrad.addColorStop(0.3, '#ff4444');
            titleGrad.addColorStop(0.5, '#ffaaaa');
            titleGrad.addColorStop(0.7, '#ff4444');
            titleGrad.addColorStop(1, '#ff0000');
            ctx.fillStyle = titleGrad;
            ctx.shadowColor = '#ff0000';
            ctx.shadowBlur = 30;
        }
        
        ctx.font = 'bold 40px monospace';
        ctx.fillText(GAME_CONFIG.title, 0, 0);
        ctx.restore();
    }
    ctx.shadowBlur = 0;
    
    // Subtitle with animation
    ctx.save();
    ctx.translate(400, 190);
    const subScale = 1 + Math.sin(t * 3) * 0.03;
    ctx.scale(subScale, subScale);
    ctx.fillStyle = '#ff8866';
    ctx.font = 'bold 20px monospace';
    ctx.fillText(GAME_CONFIG.subtitle, 0, 0);
    ctx.restore();
    
    // Stage count badge
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.roundRect(330, 210, 140, 30, 15);
    ctx.fill();
    ctx.strokeStyle = '#666';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px monospace';
    ctx.fillText(`🎮 ${levels.length} STAGES`, 400, 230);
    
    // Progress display
    const cleared = saveData.clearedStages.length;
    const progressPct = Math.floor((cleared / levels.length) * 100);
    
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(200, 260, 400, 25);
    ctx.fillStyle = '#333';
    ctx.fillRect(202, 262, 396, 21);
    
    const progGrad = ctx.createLinearGradient(202, 0, 598, 0);
    progGrad.addColorStop(0, '#00ff00');
    progGrad.addColorStop(0.5, '#88ff88');
    progGrad.addColorStop(1, '#00ff00');
    ctx.fillStyle = progGrad;
    ctx.fillRect(202, 262, 396 * (cleared / levels.length), 21);
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px monospace';
    ctx.fillText(`PROGRESS: ${cleared}/${levels.length} (${progressPct}%)`, 400, 278);
    
    // Trophies
    if (saveData.totalClears > 0) {
        ctx.save();
        ctx.translate(400, 320);
        ctx.scale(1 + Math.sin(t * 2) * 0.1, 1 + Math.sin(t * 2) * 0.1);
        ctx.fillStyle = '#ffcc00';
        ctx.shadowColor = '#ffcc00';
        ctx.shadowBlur = 20;
        ctx.font = 'bold 18px monospace';
        ctx.fillText(`🏆 ${saveData.totalClears} FULL CLEAR${saveData.totalClears > 1 ? 'S' : ''} 🏆`, 0, 0);
        ctx.shadowBlur = 0;
        ctx.restore();
    }
    
    // Start prompt with fancy animation
    const promptY = 400;
    const promptAlpha = 0.5 + Math.sin(t * 4) * 0.5;
    
    // Prompt background
    ctx.fillStyle = `rgba(255,255,255,${promptAlpha * 0.1})`;
    ctx.beginPath();
    ctx.roundRect(200, promptY - 25, 400, 50, 25);
    ctx.fill();
    
    ctx.fillStyle = `rgba(255,255,255,${promptAlpha})`;
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 15;
    ctx.font = 'bold 18px monospace';
    ctx.fillText(isTouchDevice ? '▶ TAP TO START ▶' : '▶ PRESS Z / SPACE / ENTER ▶', 400, promptY + 5);
    ctx.shadowBlur = 0;
    
    // Controls info
    ctx.fillStyle = '#888';
    ctx.font = '12px monospace';
    if (isTouchDevice) {
        ctx.fillText('🕹 Stick: Move | 🟢 JUMP | 🔵 DASH', 400, 480);
    } else {
        ctx.fillText('⬅➡ Move | Z/Space/Up: Jump | X/Shift: Dash', 400, 480);
        ctx.fillText('R: Restart | ESC: Options', 400, 505);
    }
    
    // Decorative corners
    ctx.strokeStyle = '#ff000044';
    ctx.lineWidth = 3;
    const cornerSize = 50;
    // Top left
    ctx.beginPath();
    ctx.moveTo(20, 70);
    ctx.lineTo(20, 20);
    ctx.lineTo(70, 20);
    ctx.stroke();
    // Top right
    ctx.beginPath();
    ctx.moveTo(730, 20);
    ctx.lineTo(780, 20);
    ctx.lineTo(780, 70);
    ctx.stroke();
    // Bottom left
    ctx.beginPath();
    ctx.moveTo(20, 530);
    ctx.lineTo(20, 580);
    ctx.lineTo(70, 580);
    ctx.stroke();
    // Bottom right
    ctx.beginPath();
    ctx.moveTo(730, 580);
    ctx.lineTo(780, 580);
    ctx.lineTo(780, 530);
    ctx.stroke();
    
    ctx.textAlign = 'left';
}

function drawStageSelect() {
    ctx.textAlign = 'center';
    
    // Title
    ctx.fillStyle = '#ffcc00';
    ctx.shadowColor = '#ffcc00';
    ctx.shadowBlur = 20;
    ctx.font = 'bold 28px monospace';
    ctx.fillText('STAGE SELECT', 400, 50);
    ctx.shadowBlur = 0;
    
    // Progress bar
    const cleared = saveData.clearedStages.length;
    ctx.fillStyle = '#333';
    ctx.fillRect(150, 70, 500, 10);
    ctx.fillStyle = '#00ff00';
    ctx.fillRect(150, 70, 500 * (cleared / levels.length), 10);
    ctx.fillStyle = '#fff';
    ctx.font = '10px monospace';
    ctx.fillText(`${cleared}/${levels.length}`, 400, 100);
    
    // Stage list
    const startY = 120;
    const itemHeight = 35;
    const visible = Math.floor((600 - startY - 50) / itemHeight);
    
    // Scroll
    if (stageSelectCursor < stageSelectScroll) stageSelectScroll = stageSelectCursor;
    if (stageSelectCursor >= stageSelectScroll + visible) stageSelectScroll = stageSelectCursor - visible + 1;
    
    for (let i = 0; i < visible; i++) {
        const idx = stageSelectScroll + i;
        if (idx >= levels.length) break;
        
        const lvl = levels[idx];
        const diff = getDifficultyInfo(idx);
        const y = startY + i * itemHeight;
        const isCleared = saveData.clearedStages.includes(idx);
        const isUnlocked = idx === 0 || saveData.clearedStages.includes(idx - 1);
        const isSelected = idx === stageSelectCursor;
        
        // Background
        if (isSelected) {
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fillRect(100, y - 5, 600, itemHeight - 5);
        }
        
        // Lock indicator
        ctx.textAlign = 'left';
        if (!isUnlocked) {
            ctx.fillStyle = '#666';
            ctx.font = '16px monospace';
            ctx.fillText('🔒', 110, y + 18);
        } else if (isCleared) {
            ctx.fillStyle = '#00ff00';
            ctx.font = '16px monospace';
            ctx.fillText('✓', 110, y + 18);
        } else {
            ctx.fillStyle = '#888';
            ctx.font = '16px monospace';
            ctx.fillText('○', 110, y + 18);
        }
        
        // Stage number
        ctx.fillStyle = isUnlocked ? '#fff' : '#444';
        ctx.font = 'bold 14px monospace';
        ctx.fillText(`${(idx + 1).toString().padStart(2, '0')}`, 140, y + 18);
        
        // Stage name
        ctx.fillStyle = isUnlocked ? '#fff' : '#444';
        ctx.font = '14px monospace';
        ctx.fillText(lvl.name, 180, y + 18);
        
        // Difficulty
        ctx.fillStyle = isUnlocked ? diff.color : '#333';
        ctx.font = 'bold 10px monospace';
        ctx.fillText(diff.name, 400, y + 18);
        
        // Best deaths
        if (saveData.bestDeaths[idx] !== undefined) {
            ctx.fillStyle = '#ffaaaa';
            ctx.font = '10px monospace';
            ctx.fillText(`Best: ☠${saveData.bestDeaths[idx]}`, 500, y + 18);
        }
    }
    
    // Scroll indicators
    ctx.textAlign = 'center';
    if (stageSelectScroll > 0) {
        ctx.fillStyle = '#fff';
        ctx.fillText('▲', 400, 115);
    }
    if (stageSelectScroll + visible < levels.length) {
        ctx.fillStyle = '#fff';
        ctx.fillText('▼', 400, startY + visible * itemHeight);
    }
    
    // Instructions
    ctx.fillStyle = '#888';
    ctx.font = '12px monospace';
    if (isTouchDevice) {
        ctx.fillText('Tap stage to select | Tap again to play', 400, 570);
    } else {
        ctx.fillText('↑↓: Select | Enter/Z: Play | ESC: Back', 400, 570);
    }
    
    // Back button area
    ctx.fillStyle = '#666';
    ctx.font = '12px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('< BACK', 20, 580);
    
    ctx.textAlign = 'left';
}

function drawDeathScreen() {
    ctx.fillStyle = `rgba(80,0,0,${Math.min(0.6, deathTimer / 60)})`;
    ctx.fillRect(0, 0, 800, 600);
    
    if (deathTimer > 30) {
        ctx.save();
        ctx.translate(400, 250);
        ctx.rotate(Math.sin(gameTime * 0.1) * 0.02);
        ctx.fillStyle = '#ff0000';
        ctx.shadowColor = '#ff0000';
        ctx.shadowBlur = 30;
        ctx.font = 'bold 64px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', 0, 0);
        ctx.shadowBlur = 0;
        ctx.restore();
        
        ctx.fillStyle = '#ffaaaa';
        ctx.font = '24px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`Death Count: ${deathCount}`, 400, 310);
        
        if (Math.floor(gameTime / 30) % 2 === 0) {
            ctx.fillStyle = '#fff';
            ctx.font = '18px monospace';
            ctx.fillText(isTouchDevice ? 'Tap to retry' : 'Press Z / Space / Enter to retry', 400, 370);
        }
        
        ctx.fillStyle = '#888';
        ctx.font = '14px monospace';
        ctx.fillText(isTouchDevice ? '' : 'Press R to restart stage', 400, 410);
        ctx.textAlign = 'left';
    }
}

function drawStageClear() {
    const t = gameTime * 0.03;
    
    ctx.fillStyle = `rgba(0,50,0,${Math.min(0.7, clearTimer / 60)})`;
    ctx.fillRect(0, 0, 800, 600);
    
    for (const p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.min(1, p.life / 30);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    
    ctx.textAlign = 'center';
    
    ctx.save();
    ctx.translate(400, 200);
    ctx.scale(1 + Math.sin(t * 2) * 0.05, 1 + Math.sin(t * 2) * 0.05);
    ctx.fillStyle = '#00ff00';
    ctx.shadowColor = '#00ff00';
    ctx.shadowBlur = 30;
    ctx.font = 'bold 48px monospace';
    ctx.fillText('STAGE CLEAR!', 0, 0);
    ctx.shadowBlur = 0;
    ctx.restore();
    
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.fillText(`Stage ${currentLevel + 1} Complete!`, 400, 280);
    
    ctx.fillStyle = '#ffaaaa';
    ctx.font = '18px monospace';
    ctx.fillText(`Deaths this stage: ${deathCount - (stageDeathStart || 0)}`, 400, 320);
    
    const diff = getDifficultyInfo(currentLevel);
    ctx.fillStyle = diff.color;
    ctx.font = 'bold 14px monospace';
    ctx.fillText(diff.name, 400, 360);
    
    if (clearTimer > 60 && Math.sin(t * 4) > 0) {
        ctx.fillStyle = '#fff';
        ctx.font = '16px monospace';
        if (currentLevel + 1 >= levels.length) {
            ctx.fillText(isTouchDevice ? 'Tap for results' : 'Press Z / Space / Enter for results', 400, 450);
        } else {
            ctx.fillText(isTouchDevice ? 'Tap for next stage' : 'Press Z / Space / Enter for next stage', 400, 450);
        }
    }
    
    ctx.textAlign = 'left';
}

function drawGameClear() {
    const t = gameTime * 0.03;
    
    for (let i = 0; i < 60; i++) {
        ctx.fillStyle = `hsla(${(t * 50 + i * 20) % 360},100%,50%,0.15)`;
        ctx.beginPath();
        ctx.arc(
            Math.sin(t + i) * 380 + 400,
            Math.cos(t * 0.8 + i * 0.5) * 280 + 300,
            6 + Math.sin(t + i) * 4, 0, Math.PI * 2
        );
        ctx.fill();
    }
    
    for (const p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.min(1, p.life / 30);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    
    ctx.textAlign = 'center';
    
    ctx.save();
    ctx.translate(400, 100);
    ctx.scale(1 + Math.sin(t * 2) * 0.05, 1 + Math.sin(t * 2) * 0.05);
    ctx.fillStyle = '#ffff00';
    ctx.shadowColor = '#ffff00';
    ctx.shadowBlur = 40;
    ctx.font = 'bold 38px monospace';
    ctx.fillText('CONGRATULATIONS!', 0, 0);
    ctx.shadowBlur = 0;
    ctx.restore();
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 26px monospace';
    ctx.fillText('YOU ARE THE GUY!', 400, 170);
    
    ctx.fillStyle = '#aaa';
    ctx.font = '18px monospace';
    ctx.fillText(`Total Deaths: ${totalDeathCount}`, 400, 230);
    
    const rank = getRank(totalDeathCount);
    ctx.fillStyle = rank.color;
    ctx.shadowColor = rank.color;
    ctx.shadowBlur = 20;
    ctx.font = 'bold 24px monospace';
    ctx.fillText(`${rank.icon} ${rank.name} ${rank.icon}`, 400, 290);
    ctx.shadowBlur = 0;
    
    ctx.fillStyle = '#888';
    ctx.font = '14px monospace';
    if (totalDeathCount === 0) {
        ctx.fillText('IMPOSSIBLE! You did it without dying!', 400, 330);
    } else if (totalDeathCount <= 10) {
        ctx.fillText('Incredible skill! A true master!', 400, 330);
    } else if (totalDeathCount <= 50) {
        ctx.fillText('Amazing! You are THE GUY!', 400, 330);
    } else if (totalDeathCount <= 100) {
        ctx.fillText('Great job! Keep practicing!', 400, 330);
    } else {
        ctx.fillText('You made it! Persistence pays off!', 400, 330);
    }
    
    ctx.fillStyle = '#666';
    ctx.font = '12px monospace';
    ctx.fillText(`Conquered all ${levels.length} stages!`, 400, 380);
    if (saveData.totalClears > 1) {
        ctx.fillText(`Total full clears: ${saveData.totalClears}`, 400, 400);
    }
    
    if (clearTimer > 120 && Math.sin(t * 4) > 0) {
        ctx.fillStyle = '#fff';
        ctx.font = '16px monospace';
        ctx.fillText(isTouchDevice ? 'Tap for Title' : 'Press Z / Space / Enter for Title', 400, 480);
    }
    
    ctx.textAlign = 'left';
}

// ============================================================
//  GAME LOOP
// ============================================================
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// Initialize
loadKeyBindings();
loadSaveData();
setupMobileFullscreen();
resizeCanvas();
resetLevel();
gameLoop();
</script>
