<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>I WANNA BE THE GUY - CUSTOM EDITION</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html {
    width: 100%;
    height: 100vh;
    height: 100dvh;
}
body {
    position: fixed;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    background: #000;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    display: flex;
    flex-direction: column;
}
#gameArea {
    flex: 1;
    min-height: 0;
    position: relative;
    background: #000;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}
#game {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #0a0a1a;
}
#controlsArea {
    flex: 0 0 260px;
    position: relative;
    background: rgba(20, 20, 30, 0.95);
    padding-top: 5px;
    padding-bottom: env(safe-area-inset-bottom, 0);
}
#controlsArea canvas {
    width: 100%;
    height: 100%;
}
#pcGuide {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #888;
    font-family: monospace;
    font-size: 14px;
    text-align: center;
    line-height: 2;
}

@media (min-width: 800px) {
    body {
        justify-content: center;
        align-items: center;
    }
    #gameArea {
        flex: 1;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    #controlsArea {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        flex: none;
        height: 40px;
        width: auto;
        min-width: 600px;
        opacity: 0.4;
        border-radius: 8px 8px 0 0;
    }
    #pcGuide {
        display: block;
    }
}

#optionsOverlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.9); z-index: 200; color: #fff; font-family: monospace; overflow-y: auto;
}
#optionsContent { max-width: 600px; margin: 20px auto; padding: 20px; }
#optionsContent h2 { color: #ff4444; margin-bottom: 20px; text-align: center; }
.key-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; padding: 10px; background: #222; border-radius: 5px; }
.key-row label { color: #aaa; }
.key-btn { background: #444; color: #fff; border: 2px solid #666; padding: 10px 20px; min-width: 120px; cursor: pointer; font-family: monospace; font-size: 14px; border-radius: 5px; transition: all 0.2s; }
.key-btn:hover { background: #555; border-color: #888; }
.key-btn.listening { background: #ff4444; border-color: #ff6666; animation: pulse 0.5s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
.options-btn { background: #0088ff; color: #fff; border: none; padding: 15px 30px; margin: 10px; cursor: pointer; font-family: monospace; font-size: 16px; border-radius: 5px; }
.options-btn:hover { background: #00aaff; }
.options-btn.reset { background: #ff4444; }
.options-btn.reset:hover { background: #ff6666; }
.options-btn.menu { background: #888; }
.options-btn.menu:hover { background: #aaa; }
#optionsButtons { text-align: center; margin-top: 30px; }
.section-title { color: #ffcc00; margin: 30px 0 15px 0; padding-bottom: 5px; border-bottom: 1px solid #444; }
</style>
</head>
<body>
<div id="gameArea">
    <canvas id="game"></canvas>
</div>
<div id="controlsArea">
    <canvas id="touchCanvas"></canvas>
    <div id="pcGuide">
        ← → : Move | Z / Space / ↑ : Jump | X / Shift : Dash | R : Restart | ESC : Options
    </div>
</div>
<div id="optionsOverlay">
    <div id="optionsContent">
        <h2>⚙ KEY CONFIGURATION ⚙</h2>
        <div class="section-title">MOVEMENT</div>
        <div class="key-row"><label>Move Left</label><button class="key-btn" data-action="left">ArrowLeft</button></div>
        <div class="key-row"><label>Move Right</label><button class="key-btn" data-action="right">ArrowRight</button></div>
        <div class="section-title">ACTIONS</div>
        <div class="key-row"><label>Jump</label><button class="key-btn" data-action="jump">Space</button></div>
        <div class="key-row"><label>Dash</label><button class="key-btn" data-action="dash">KeyX</button></div>
        <div class="section-title">SYSTEM</div>
        <div class="key-row"><label>Restart Stage</label><button class="key-btn" data-action="restart">KeyR</button></div>
        <div id="optionsButtons">
            <button class="options-btn reset" onclick="resetKeyBindings()">Reset to Default</button>
            <button class="options-btn" onclick="closeOptions()">Save & Close</button>
            <button class="options-btn menu" onclick="returnToMenu()">Return to Menu</button>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const touchCanvas = document.getElementById('touchCanvas');
const touchCtx = touchCanvas.getContext('2d');
const gameArea = document.getElementById('gameArea');
const controlsArea = document.getElementById('controlsArea');
const optionsOverlay = document.getElementById('optionsOverlay');

const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const GAME_SPEED = isMobile ? 0.75 : 1.0;
let gameSpeedAccum = 0;

const GAME_WIDTH = 800;
const GAME_HEIGHT = 600;
let scaleX = 1;
let scaleY = 1;
let dpr = 1;

function resizeCanvas() {
    const areaW = gameArea.clientWidth;
    const areaH = gameArea.clientHeight;
    
    if (isMobile) {
        dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        canvas.width = areaW * dpr;
        canvas.height = areaH * dpr;
        canvas.style.width = areaW + 'px';
        canvas.style.height = areaH + 'px';
        scaleX = (areaW * dpr) / GAME_WIDTH;
        scaleY = (areaH * dpr) / GAME_HEIGHT;
    } else {
        const baseScale = Math.min(areaW / GAME_WIDTH, areaH / GAME_HEIGHT);
        const displayScale = Math.min(baseScale, 1.5);
        const displayW = Math.floor(GAME_WIDTH * displayScale);
        const displayH = Math.floor(GAME_HEIGHT * displayScale);
        canvas.width = GAME_WIDTH * 1.5;
        canvas.height = GAME_HEIGHT * 1.5;
        canvas.style.width = displayW + 'px';
        canvas.style.height = displayH + 'px';
        scaleX = 1.5;
        scaleY = 1.5;
        dpr = 1;
    }
    
    const ctrlW = controlsArea.clientWidth;
    const ctrlH = controlsArea.clientHeight;
    const ctrlDpr = isMobile ? Math.min(window.devicePixelRatio || 1, 2) : 1;
    touchCanvas.width = ctrlW * ctrlDpr;
    touchCanvas.height = ctrlH * ctrlDpr;
    touchCanvas.style.width = ctrlW + 'px';
    touchCanvas.style.height = ctrlH + 'px';
    
    updateButtonPositions();
}

let resizeTimeout;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(resizeCanvas, 50);
});

let saveData = {
    clearedStages: [],
    bestDeaths: {},
    totalDeaths: 0,
    currentStage: 0
};

function loadSaveData() {
    const s = localStorage.getItem('iwbtg_savedata');
    if (s) {
        try { saveData = { ...saveData, ...JSON.parse(s) }; } catch(e) {}
    }
}

function saveSaveData() {
    localStorage.setItem('iwbtg_savedata', JSON.stringify(saveData));
}

const defaultKeyBindings = {
    left:'ArrowLeft', right:'ArrowRight',
    jump:'Space', dash:'KeyX', restart:'KeyR'
};
let keyBindings = { ...defaultKeyBindings };

function loadKeyBindings() {
    const s = localStorage.getItem('iwbtg_keybindings');
    if (s) { try { keyBindings = { ...defaultKeyBindings, ...JSON.parse(s) }; } catch(e) { keyBindings = { ...defaultKeyBindings }; } }
    updateKeyButtons();
}
function saveKeyBindings() { localStorage.setItem('iwbtg_keybindings', JSON.stringify(keyBindings)); }
function resetKeyBindings() { keyBindings = { ...defaultKeyBindings }; saveKeyBindings(); updateKeyButtons(); }
function updateKeyButtons() {
    document.querySelectorAll('.key-btn').forEach(btn => {
        const a = btn.dataset.action; if (keyBindings[a]) btn.textContent = formatKeyName(keyBindings[a]);
    });
}
function formatKeyName(c) { return c.replace('Key','').replace('Arrow','').replace('Shift','Shift ').replace('Left','L').replace('Right','R'); }

let listeningButton = null;
let previousGameState = 'title';

function openOptions() { 
    optionsOverlay.style.display = 'block'; 
    previousGameState = gameState;
    gameState = 'options'; 
}
function closeOptions() {
    optionsOverlay.style.display = 'none';
    gameState = previousGameState;
    saveKeyBindings();
}
function returnToMenu() {
    optionsOverlay.style.display = 'none';
    gameState = 'title';
    currentLevel = 0;
    stageSelectPage = 0;
    selectedStage = 0;
}

document.querySelectorAll('.key-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        if (listeningButton) listeningButton.classList.remove('listening');
        listeningButton = this; this.classList.add('listening'); this.textContent = 'Press a key...';
    });
});
document.addEventListener('keydown', function(e) {
    if (listeningButton) {
        e.preventDefault(); keyBindings[listeningButton.dataset.action] = e.code;
        listeningButton.textContent = formatKeyName(e.code);
        listeningButton.classList.remove('listening'); listeningButton = null;
    }
});

const touchState = { stick:{ active:false, id:null, x:0, y:0, dx:0, dy:0 }, jump:false, dash:false };
const stickConfig = { x:100, y:0, baseRadius:65, stickRadius:40, maxDist:50 };
const buttonConfig = {
    jump:{ x:0, y:0, radius:52, label:'JUMP', color:'#00aa00' },
    dash:{ x:0, y:0, radius:42, label:'DASH', color:'#0088ff' }
};

let touchButtonPositions = { jump: {x:0,y:0}, dash: {x:0,y:0}, stick: {x:0,y:0} };

function updateButtonPositions() {
    const ctrlW = controlsArea.clientWidth;
    const ctrlH = controlsArea.clientHeight;
    const ctrlDpr = isMobile ? Math.min(window.devicePixelRatio || 1, 2) : 1;
    
    const centerY = ctrlH * 0.35;
    
    touchButtonPositions.stick.x = Math.max(100, Math.min(130, ctrlW * 0.18));
    touchButtonPositions.stick.y = centerY;
    
    touchButtonPositions.jump.x = ctrlW - 75;
    touchButtonPositions.jump.y = centerY;
    
    touchButtonPositions.dash.x = ctrlW - 165;
    touchButtonPositions.dash.y = centerY - 15;
    
    stickConfig.x = touchButtonPositions.stick.x * ctrlDpr;
    stickConfig.y = touchButtonPositions.stick.y * ctrlDpr;
    stickConfig.baseRadius = 70 * ctrlDpr;
    stickConfig.stickRadius = 45 * ctrlDpr;
    stickConfig.maxDist = 55 * ctrlDpr;
    
    buttonConfig.jump.x = touchButtonPositions.jump.x * ctrlDpr;
    buttonConfig.jump.y = touchButtonPositions.jump.y * ctrlDpr;
    buttonConfig.jump.radius = 55 * ctrlDpr;
    
    buttonConfig.dash.x = touchButtonPositions.dash.x * ctrlDpr;
    buttonConfig.dash.y = touchButtonPositions.dash.y * ctrlDpr;
    buttonConfig.dash.radius = 45 * ctrlDpr;
}

function handleTouchStart(e) {
    e.preventDefault(); const rect = touchCanvas.getBoundingClientRect();
    for (let t of e.changedTouches) {
        const x = t.clientX - rect.left;
        const y = t.clientY - rect.top;
        
        const stickDist = Math.sqrt((x-touchButtonPositions.stick.x)**2+(y-touchButtonPositions.stick.y)**2);
        if (stickDist < 90 && !touchState.stick.active) {
            touchState.stick.active = true;
            touchState.stick.id = t.identifier;
            updateStickDelta(x, y);
        }
        
        const jumpDist = Math.sqrt((x-touchButtonPositions.jump.x)**2+(y-touchButtonPositions.jump.y)**2);
        if (jumpDist < 65) touchState.jump = true;
        
        const dashDist = Math.sqrt((x-touchButtonPositions.dash.x)**2+(y-touchButtonPositions.dash.y)**2);
        if (dashDist < 55) touchState.dash = true;
    }
}
function handleTouchMove(e) {
    e.preventDefault(); const rect = touchCanvas.getBoundingClientRect();
    for (let t of e.changedTouches) {
        if (t.identifier === touchState.stick.id) {
            updateStickDelta(t.clientX - rect.left, t.clientY - rect.top);
        }
    }
}
function handleTouchEnd(e) {
    e.preventDefault();
    for (let t of e.changedTouches) {
        if (t.identifier === touchState.stick.id) {
            touchState.stick.active = false;
            touchState.stick.id = null;
            touchState.stick.dx = 0;
            touchState.stick.dy = 0;
        }
    }
    if (e.touches.length === 0) {
        touchState.jump = false;
        touchState.dash = false;
    } else {
        const rect = touchCanvas.getBoundingClientRect();
        let jumpStillPressed = false;
        let dashStillPressed = false;
        for (let t of e.touches) {
            const x = t.clientX - rect.left;
            const y = t.clientY - rect.top;
            if (Math.sqrt((x-touchButtonPositions.jump.x)**2+(y-touchButtonPositions.jump.y)**2) < 65) jumpStillPressed = true;
            if (Math.sqrt((x-touchButtonPositions.dash.x)**2+(y-touchButtonPositions.dash.y)**2) < 55) dashStillPressed = true;
        }
        touchState.jump = jumpStillPressed;
        touchState.dash = dashStillPressed;
    }
}
function updateStickDelta(x, y) {
    let dx = x - touchButtonPositions.stick.x;
    let dy = y - touchButtonPositions.stick.y;
    const d = Math.sqrt(dx*dx + dy*dy);
    const maxDist = 55;
    if (d > maxDist) { dx = (dx / d) * maxDist; dy = (dy / d) * maxDist; }
    touchState.stick.dx = dx / maxDist;
    touchState.stick.dy = dy / maxDist;
}

touchCanvas.addEventListener('touchstart', handleTouchStart, {passive:false});
touchCanvas.addEventListener('touchmove', handleTouchMove, {passive:false});
touchCanvas.addEventListener('touchend', handleTouchEnd, {passive:false});
touchCanvas.addEventListener('touchcancel', handleTouchEnd, {passive:false});

function drawTouchControls() {
    const ctrlDpr = isMobile ? Math.min(window.devicePixelRatio || 1, 2) : 1;
    touchCtx.clearRect(0, 0, touchCanvas.width, touchCanvas.height);
    if (!isMobile) return;
    
    const g = touchCtx.createRadialGradient(stickConfig.x, stickConfig.y, 0, stickConfig.x, stickConfig.y, stickConfig.baseRadius);
    g.addColorStop(0, '#333'); g.addColorStop(0.7, '#222'); g.addColorStop(1, '#111');
    touchCtx.beginPath();
    touchCtx.arc(stickConfig.x, stickConfig.y, stickConfig.baseRadius, 0, Math.PI*2);
    touchCtx.fillStyle = g;
    touchCtx.fill();
    touchCtx.strokeStyle = '#444';
    touchCtx.lineWidth = 3 * ctrlDpr;
    touchCtx.stroke();
    
    const kx = stickConfig.x + touchState.stick.dx * stickConfig.maxDist;
    const ky = stickConfig.y + touchState.stick.dy * stickConfig.maxDist;
    touchCtx.beginPath();
    touchCtx.arc(kx + 2*ctrlDpr, ky + 2*ctrlDpr, stickConfig.stickRadius, 0, Math.PI*2);
    touchCtx.fillStyle = 'rgba(0,0,0,0.4)';
    touchCtx.fill();
    const kg = touchCtx.createRadialGradient(kx - 10*ctrlDpr, ky - 10*ctrlDpr, 0, kx, ky, stickConfig.stickRadius);
    kg.addColorStop(0, '#888'); kg.addColorStop(0.5, '#666'); kg.addColorStop(1, '#444');
    touchCtx.beginPath();
    touchCtx.arc(kx, ky, stickConfig.stickRadius, 0, Math.PI*2);
    touchCtx.fillStyle = kg;
    touchCtx.fill();
    touchCtx.strokeStyle = touchState.stick.active ? '#aaa' : '#555';
    touchCtx.lineWidth = 3 * ctrlDpr;
    touchCtx.stroke();
    
    drawTouchButton(buttonConfig.jump, touchState.jump, ctrlDpr);
    drawTouchButton(buttonConfig.dash, touchState.dash, ctrlDpr);
}

function drawTouchButton(cfg, pressed, dpr) {
    const {x, y, radius: r, label, color} = cfg;
    touchCtx.beginPath();
    touchCtx.arc(x + 2*dpr, y + 2*dpr, r, 0, Math.PI*2);
    touchCtx.fillStyle = 'rgba(0,0,0,0.4)';
    touchCtx.fill();
    const g = touchCtx.createRadialGradient(x - r/3, y - r/3, 0, x, y, r);
    if (pressed) { g.addColorStop(0, color); g.addColorStop(1, '#222'); }
    else { g.addColorStop(0, lightenColor(color, 40)); g.addColorStop(0.7, color); g.addColorStop(1, darkenColor(color, 40)); }
    touchCtx.beginPath();
    touchCtx.arc(x, y, r, 0, Math.PI*2);
    touchCtx.fillStyle = g;
    touchCtx.fill();
    touchCtx.strokeStyle = pressed ? '#fff' : '#666';
    touchCtx.lineWidth = 3 * dpr;
    touchCtx.stroke();
    touchCtx.fillStyle = pressed ? '#fff' : '#ddd';
    touchCtx.font = `bold ${15 * dpr}px monospace`;
    touchCtx.textAlign = 'center';
    touchCtx.textBaseline = 'middle';
    touchCtx.fillText(label, x, y);
}

function lightenColor(c,p){const n=parseInt(c.replace('#',''),16),a=Math.round(2.55*p);return '#'+(0x1000000+Math.min(255,(n>>16)+a)*0x10000+Math.min(255,((n>>8)&0xFF)+a)*0x100+Math.min(255,(n&0xFF)+a)).toString(16).slice(1);}
function darkenColor(c,p){const n=parseInt(c.replace('#',''),16),a=Math.round(2.55*p);return '#'+(0x1000000+Math.max(0,(n>>16)-a)*0x10000+Math.max(0,((n>>8)&0xFF)-a)*0x100+Math.max(0,(n&0xFF)-a)).toString(16).slice(1);}

let gameState = 'title';
let deathCount = 0;
let currentLevel = 0;
let screenShake = 0;
let deathTimer = 0;
let clearTimer = 0;
let gameTime = 0;
let slowMotion = 1;
let flashEffect = 0;
let stageSelectPage = 0;
let selectedStage = 0;
const STAGES_PER_PAGE = 10;
const TOTAL_STAGES = 20;

let particles = [];
let bloodParticles = [];
let sparkParticles = [];
let textParticles = [];
let trailParticles = [];
let backgroundStars = [];

// ギミック用の動的オブジェクト
let apples = [];
let bullets = [];
let movingPlatforms = [];
let disappearingPlatforms = [];
let lasers = [];
let sawBlades = [];
let fallingBlocks = [];

function initStars() {
    backgroundStars = [];
    for (let i = 0; i < 80; i++) {
        backgroundStars.push({
            x: Math.random() * GAME_WIDTH,
            y: Math.random() * GAME_HEIGHT,
            size: Math.random() * 2 + 0.5,
            speed: Math.random() * 0.3 + 0.1,
            twinkle: Math.random() * Math.PI * 2
        });
    }
}
initStars();

const player = {
    x:50, y:500, w:16, h:20,
    vx:0, vy:0, speed: isMobile ? 6 : 4, jumpForce:-9,
    onGround:false, dead:false, facing:1,
    doubleJump:true, jumpHeld:false,
    dashCooldown:0, dashing:false, dashTime:0,
    invincible:0, runFrame:0
};

const keys = {};
let keysPressed = {};
let prevTouchJump = false;
let prevTouchDash = false;

document.addEventListener('keydown', e => {
    if (listeningButton) return;
    if (!keys[e.code]) keysPressed[e.code] = true;
    keys[e.code] = true;
    
    if (e.code === 'Escape') {
        if (gameState === 'options') closeOptions();
        else if (gameState === 'playing' || gameState === 'dead') openOptions();
        e.preventDefault();
        return;
    }
    
    if (gameState === 'dead' && deathTimer > 30) {
        gameState = 'playing';
        resetLevel();
        e.preventDefault();
        return;
    }
    
    if (gameState === 'title') {
        if (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyZ') {
            gameState = 'stageSelect';
            stageSelectPage = 0;
            selectedStage = findFirstUnlockedStage();
        }
        e.preventDefault();
        return;
    }
    
    if (gameState === 'stageSelect') {
        const cols = 5;
        if (e.code === 'ArrowLeft') {
            selectedStage = Math.max(0, selectedStage - 1);
            stageSelectPage = Math.floor(selectedStage / STAGES_PER_PAGE);
        } else if (e.code === 'ArrowRight') {
            selectedStage = Math.min(TOTAL_STAGES - 1, selectedStage + 1);
            stageSelectPage = Math.floor(selectedStage / STAGES_PER_PAGE);
        } else if (e.code === 'ArrowUp') {
            selectedStage = Math.max(0, selectedStage - cols);
            stageSelectPage = Math.floor(selectedStage / STAGES_PER_PAGE);
        } else if (e.code === 'ArrowDown') {
            selectedStage = Math.min(TOTAL_STAGES - 1, selectedStage + cols);
            stageSelectPage = Math.floor(selectedStage / STAGES_PER_PAGE);
        } else if (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyZ') {
            if (isStageUnlocked(selectedStage)) {
                currentLevel = selectedStage;
                deathCount = 0;
                gameState = 'playing';
                resetLevel();
            }
        } else if (e.code === 'Escape' || e.code === 'Backspace') {
            gameState = 'title';
        }
        e.preventDefault();
        return;
    }
    
    if (gameState === 'clear' && clearTimer > 60) {
        gameState = 'title';
        currentLevel = 0;
        stageSelectPage = 0;
        selectedStage = 0;
        e.preventDefault();
        return;
    }
    
    if (e.code === keyBindings.restart && (gameState === 'playing' || gameState === 'dead')) {
        gameState = 'playing';
        resetLevel();
    }
    e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

canvas.addEventListener('click', e => {
    if (isMobile) return;
    
    const rect = canvas.getBoundingClientRect();
    const clickX = (e.clientX - rect.left) / rect.width * GAME_WIDTH;
    const clickY = (e.clientY - rect.top) / rect.height * GAME_HEIGHT;
    
    if (gameState === 'title') {
        gameState = 'stageSelect';
        stageSelectPage = 0;
        selectedStage = findFirstUnlockedStage();
        return;
    }
    
    if (gameState === 'stageSelect') {
        if (clickX >= 20 && clickX <= 100 && clickY >= 20 && clickY <= 60) {
            gameState = 'title';
            return;
        }
        
        const startX = 100, startY = 150, btnW = 120, btnH = 60, cols = 5;
        for (let i = 0; i < STAGES_PER_PAGE; i++) {
            const stageNum = stageSelectPage * STAGES_PER_PAGE + i;
            if (stageNum >= TOTAL_STAGES) break;
            const col = i % cols;
            const row = Math.floor(i / cols);
            const bx = startX + col * (btnW + 20);
            const by = startY + row * (btnH + 20);
            
            if (clickX >= bx && clickX <= bx + btnW && clickY >= by && clickY <= by + btnH) {
                if (isStageUnlocked(stageNum)) {
                    currentLevel = stageNum;
                    deathCount = 0;
                    gameState = 'playing';
                    resetLevel();
                }
                return;
            }
        }
        
        if (clickY > 450 && clickY < 500) {
            if (clickX < GAME_WIDTH / 2 && stageSelectPage > 0) {
                stageSelectPage--;
                selectedStage = stageSelectPage * STAGES_PER_PAGE;
            } else if (clickX >= GAME_WIDTH / 2 && (stageSelectPage + 1) * STAGES_PER_PAGE < TOTAL_STAGES) {
                stageSelectPage++;
                selectedStage = stageSelectPage * STAGES_PER_PAGE;
            }
        }
        return;
    }
    
    if (gameState === 'clear' && clearTimer > 60) {
        gameState = 'title';
        currentLevel = 0;
    }
});

canvas.addEventListener('touchstart', e => {
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches[0];
    const touchX = (touch.clientX - rect.left) / rect.width * GAME_WIDTH;
    const touchY = (touch.clientY - rect.top) / rect.height * GAME_HEIGHT;
    
    if (gameState === 'title') {
        gameState = 'stageSelect';
        stageSelectPage = 0;
        selectedStage = findFirstUnlockedStage();
        return;
    }
    
    if (gameState === 'stageSelect') {
        handleStageSelectTouch(touchX, touchY);
        return;
    }
    
    if (gameState === 'dead' && deathTimer > 30) {
        const relativeY = touchY / GAME_HEIGHT;
        if (relativeY < 0.2) {
            gameState = 'title';
            currentLevel = 0;
            stageSelectPage = 0;
        } else {
            gameState = 'playing';
            resetLevel();
        }
        return;
    }
    
    if (gameState === 'clear' && clearTimer > 60) {
        gameState = 'title';
        currentLevel = 0;
        stageSelectPage = 0;
    }
});

function handleStageSelectTouch(touchX, touchY) {
    if (touchX < 100 && touchY < 80) {
        gameState = 'title';
        return;
    }
    
    const startX = 100, startY = 150, btnW = 120, btnH = 60, cols = 5;
    for (let i = 0; i < STAGES_PER_PAGE; i++) {
        const stageNum = stageSelectPage * STAGES_PER_PAGE + i;
        if (stageNum >= TOTAL_STAGES) break;
        const col = i % cols;
        const row = Math.floor(i / cols);
        const bx = startX + col * (btnW + 20);
        const by = startY + row * (btnH + 20);
        
        if (touchX >= bx && touchX <= bx + btnW && touchY >= by && touchY <= by + btnH) {
            if (isStageUnlocked(stageNum)) {
                currentLevel = stageNum;
                deathCount = 0;
                gameState = 'playing';
                resetLevel();
            }
            return;
        }
    }
    
    if (touchY > 450) {
        if (touchX < GAME_WIDTH / 2 && stageSelectPage > 0) {
            stageSelectPage--;
        } else if (touchX >= GAME_WIDTH / 2 && (stageSelectPage + 1) * STAGES_PER_PAGE < TOTAL_STAGES) {
            stageSelectPage++;
        }
    }
}

function isStageUnlocked(stageNum) {
    return stageNum === 0 || saveData.clearedStages.includes(stageNum - 1);
}

function findFirstUnlockedStage() {
    for (let i = 0; i < TOTAL_STAGES; i++) {
        if (!saveData.clearedStages.includes(i)) return i;
    }
    return 0;
}

function isActionPressed(a) {
    switch(a) {
        case 'left': return (isMobile && touchState.stick.dx < -0.3) || keys[keyBindings.left] || keys['ArrowLeft'];
        case 'right': return (isMobile && touchState.stick.dx > 0.3) || keys[keyBindings.right] || keys['ArrowRight'];
        case 'jump': return (isMobile && touchState.jump) || keys[keyBindings.jump] || keys['KeyZ'] || keys['ArrowUp'];
        case 'dash': return (isMobile && touchState.dash) || keys[keyBindings.dash] || keys['ShiftLeft'] || keys['ShiftRight'];
    } return false;
}
function isActionJustPressed(a) {
    switch(a) {
        case 'dash': if (isMobile && touchState.dash && !prevTouchDash) return true; return keysPressed[keyBindings.dash] || keysPressed['ShiftLeft'] || keysPressed['ShiftRight'];
        case 'jump': if (isMobile && touchState.jump && !prevTouchJump) return true; return keysPressed[keyBindings.jump] || keysPressed['KeyZ'] || keysPressed['ArrowUp'];
    } return false;
}
function clearKeysPressed() { keysPressed = {}; }

    if (stageNum < 5) return { name: 'NORMAL', color: '#44ff44' };
    if (stageNum < 13) return { name: 'HARD', color: '#ffaa00' };
    return { name: 'EXTREME', color: '#ff4444' };
}

function resetLevel() {
    const lvl = levels[currentLevel]; 
    if (!lvl) return;
    
    player.x = lvl.spawnX; 
    player.y = lvl.spawnY;
    player.vx = 0; 
    player.vy = 0; 
    player.dead = false; 
    player.onGround = false;
    player.doubleJump = true; 
    player.dashCooldown = 0; 
    player.dashing = false;
    player.invincible = 0; 
    player.jumpHeld = false;
    
    bloodParticles = []; 
    sparkParticles = []; 
    textParticles = [];
    trailParticles = []; 
    particles = []; 
    screenShake = 0; 
    slowMotion = 1;
    flashEffect = 0;
    
    // ギミックのリセット
    apples = lvl.apples ? lvl.apples.map(a => ({...a, falling: false, vy: 0})) : [];
    bullets = [];
    movingPlatforms = lvl.movingPlatforms ? lvl.movingPlatforms.map(p => ({...p, x: p.origX !== undefined ? p.origX : p.x, y: p.origY !== undefined ? p.origY : p.y, phase: 0})) : [];
    disappearingPlatforms = lvl.disappearingPlatforms ? lvl.disappearingPlatforms.map(p => ({...p, visible: true, timer: 0, touched: false})) : [];
    lasers = lvl.lasers ? lvl.lasers.map(l => ({...l})) : [];
    sawBlades = lvl.sawBlades ? lvl.sawBlades.map(s => ({...s})) : [];
    fallingBlocks = [];
    
    keysPressed = {}; 
    prevTouchJump = false; 
    prevTouchDash = false;
}

function createTextParticle(x, y, text, color = '#fff') { 
    textParticles.push({ x, y, text, color, vy: -2, life: 60, size: 16 }); 
}

function killPlayer() {
    if (player.dead || player.invincible > 0) return;
    player.dead = true; 
    deathCount++; 
    deathTimer = 0;
    gameState = 'dead'; 
    slowMotion = 0.3;
    screenShake = 15;
    
    for (let i = 0; i < 60; i++) {
        const a = Math.random() * Math.PI * 2, s = Math.random() * 15 + 3;
        bloodParticles.push({ 
            x: player.x + player.w / 2, 
            y: player.y + player.h / 2, 
            vx: Math.cos(a) * s, 
            vy: Math.sin(a) * s - 5, 
            life: 80 + Math.random() * 80, 
            size: 2 + Math.random() * 8, 
            color: Math.random() > 0.3 ? '#ff0000' : '#880000', 
            gravity: 0.4 
        });
    }
    for (let i = 0; i < 20; i++) {
        sparkParticles.push({ 
            x: player.x + player.w / 2, 
            y: player.y + player.h / 2, 
            vx: (Math.random() - 0.5) * 20, 
            vy: (Math.random() - 0.5) * 20, 
            life: 20 + Math.random() * 20, 
            color: '#fff' 
        });
    }
    createTextParticle(player.x, player.y - 20, 'DEAD!', '#ff0000');
}

function rectCollision(a, b) { 
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; 
}

function circleRectCollision(cx, cy, r, rx, ry, rw, rh) {
    const closestX = Math.max(rx, Math.min(cx, rx + rw));
    const closestY = Math.max(ry, Math.min(cy, ry + rh));
    const distanceX = cx - closestX;
    const distanceY = cy - closestY;
    return (distanceX * distanceX + distanceY * distanceY) < (r * r);
}

function updateGimmicks() {
    const lvl = levels[currentLevel];
    if (!lvl) return;
    
    // リンゴの更新
    for (const apple of apples) {
        if (!apple.falling) {
            // トリガーチェック
            if (apple.direction === 'down') {
                if (player.x + player.w > apple.triggerX - 30 && player.x < apple.triggerX + 60) {
                    apple.falling = true;
                }
            } else {
                if (player.x + player.w > apple.triggerX - 30 && player.x < apple.triggerX + 60) {
                    apple.falling = true;
                }
            }
        } else {
            if (apple.direction === 'down') {
                apple.vy += 0.5;
                apple.y += apple.vy;
            } else {
                apple.vy -= 0.5;
                apple.y += apple.vy;
            }
        }
        
        // プレイヤーとの衝突
        if (circleRectCollision(apple.x + 12, apple.y + 12, 12, player.x, player.y, player.w, player.h)) {
            killPlayer();
        }
    }
    
    // 弾丸の更新
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        
        // 画面外チェック
        if (b.x < -20 || b.x > GAME_WIDTH + 20 || b.y < -20 || b.y > GAME_HEIGHT + 20) {
            bullets.splice(i, 1);
            continue;
        }
        
        // プレイヤーとの衝突
        if (circleRectCollision(b.x, b.y, b.radius || 6, player.x, player.y, player.w, player.h)) {
            killPlayer();
        }
    }
    
    // シューターの更新
    if (lvl.shooters) {
        for (const s of lvl.shooters) {
            s.timer++;
            if (s.timer >= s.interval) {
                s.timer = 0;
                let vx = 0, vy = 0;
                let spawnX = s.x, spawnY = s.y;
                switch (s.dir) {
                    case 'right': vx = s.bulletSpeed; spawnX = s.x + 10; break;
                    case 'left': vx = -s.bulletSpeed; spawnX = s.x - 10; break;
                    case 'down': vy = s.bulletSpeed; spawnY = s.y + 10; break;
                    case 'up': vy = -s.bulletSpeed; spawnY = s.y - 10; break;
                }
                bullets.push({ x: spawnX, y: spawnY, vx, vy, radius: 6 });
            }
        }
    }
    
    // 動く足場の更新
    for (const p of movingPlatforms) {
        p.phase = (p.phase || 0) + p.speed * 0.02;
        if (p.moveType === 'horizontal') {
            p.x = p.origX + Math.sin(p.phase) * p.range;
        } else {
            p.y = p.origY + Math.sin(p.phase) * p.range;
        }
    }
    
    // 消える足場の更新
    for (const p of disappearingPlatforms) {
        if (p.touched) {
            p.timer++;
            if (p.timer >= p.delay && p.visible) {
                p.visible = false;
                p.timer = 0;
            } else if (!p.visible) {
                if (p.timer >= p.respawn) {
                    p.visible = true;
                    p.touched = false;
                    p.timer = 0;
                }
            }
        }
    }
    
    // レーザーの更新
    for (const l of lasers) {
        l.timer++;
        const totalCycle = l.onTime + l.offTime;
        const cyclePos = l.timer % totalCycle;
        l.active = cyclePos < l.onTime;
        
        // プレイヤーとの衝突
        if (l.active && rectCollision(player, { x: l.x, y: l.y, w: l.w, h: l.h })) {
            killPlayer();
        }
    }
    
    // ノコギリの更新
    for (const s of sawBlades) {
        if (s.orbitRadius > 0) {
            s.angle += s.speed;
            s.x = s.centerX + Math.cos(s.angle) * s.orbitRadius;
            s.y = s.centerY + Math.sin(s.angle) * s.orbitRadius;
        } else if (s.moveType === 'horizontal') {
            s.phase = (s.phase || 0) + s.moveSpeed * 0.02;
            s.x = s.centerX + Math.sin(s.phase) * s.range;
        }
        s.angle += 0.1; // 回転アニメーション用
        
        // プレイヤーとの衝突
        if (circleRectCollision(s.x, s.y, s.radius, player.x, player.y, player.w, player.h)) {
            killPlayer();
        }
    }
    
    // ジャンプパッドのチェック
    if (lvl.jumpPads) {
        for (const pad of lvl.jumpPads) {
            if (rectCollision(player, { x: pad.x, y: pad.y, w: pad.w, h: pad.h })) {
                if (player.vy >= 0) {
                    player.vy = pad.power;
                    player.onGround = false;
                    player.doubleJump = true;
                    // エフェクト
                    for (let i = 0; i < 8; i++) {
                        particles.push({
                            x: player.x + player.w / 2,
                            y: pad.y,
                            vx: (Math.random() - 0.5) * 6,
                            vy: -Math.random() * 5 - 3,
                            life: 20,
                            size: 3,
                            color: '#ffff00',
                            gravity: 0.2
                        });
                    }
                }
            }
        }
    }
    
    // 偽ブロックのチェック
    if (lvl.fakeBlocks) {
        for (const fb of lvl.fakeBlocks) {
            if (rectCollision(player, { x: fb.x, y: fb.y, w: fb.w, h: fb.h })) {
                if (fb.type === 'fake_death') {
                    killPlayer();
                } else if (fb.type === 'fake_fall') {
                    // 落ちるブロックに変換
                    if (!fb.falling) {
                        fb.falling = true;
                        fb.vy = 0;
                    }
                }
            }
            
            // 落ちるブロックの更新
            if (fb.falling) {
                fb.vy = (fb.vy || 0) + 0.3;
                fb.y += fb.vy;
            }
        }
    }
}

function update() {
    gameTime++;
    if (slowMotion < 1) slowMotion = Math.min(1, slowMotion + 0.02);
    if (screenShake > 0) screenShake *= 0.9;
    
    if (gameState === 'dead') { 
        deathTimer++; 
        updateParticles(); 
        return; 
    }
    if (gameState === 'clear') { 
        clearTimer++; 
        updateParticles(); 
        return; 
    }
    if (gameState !== 'playing') return;

    const lvl = levels[currentLevel]; 
    if (!lvl) return;

    // 軌跡パーティクル
    if (Math.abs(player.vx) > 0 || Math.abs(player.vy) > 2) {
        trailParticles.push({ 
            x: player.x + player.w / 2, 
            y: player.y + player.h / 2, 
            size: player.dashing ? 8 : 4, 
            life: player.dashing ? 15 : 8, 
            color: player.dashing ? '#00ffff' : '#ffffff44' 
        });
    }

    if (player.invincible > 0) player.invincible--;
    if (player.dashCooldown > 0) player.dashCooldown--;

    // 移動
    if (!player.dashing) {
        player.vx = 0;
        if (isActionPressed('left')) { player.vx = -player.speed; player.facing = -1; }
        if (isActionPressed('right')) { player.vx = player.speed; player.facing = 1; }
    }

    // ダッシュ
    if (isActionJustPressed('dash') && player.dashCooldown <= 0 && !player.dashing) {
        player.dashing = true; 
        player.dashTime = 8; 
        player.dashCooldown = 45;
        player.vx = player.facing * 15; 
        player.vy = 0; 
        player.invincible = 10;
        for (let i = 0; i < 10; i++) {
            particles.push({ 
                x: player.x + player.w / 2, 
                y: player.y + player.h / 2, 
                vx: -player.facing * (Math.random() * 5 + 2), 
                vy: (Math.random() - 0.5) * 3, 
                life: 15, 
                size: 3 + Math.random() * 3, 
                color: '#00ffff', 
                gravity: 0 
            });
        }
    }
    if (player.dashing) { 
        player.dashTime--; 
        if (player.dashTime <= 0) { 
            player.dashing = false; 
            player.vx = player.facing * player.speed * 0.5; 
        } 
    }

    // ジャンプ
    const jumpKey = isActionPressed('jump');
    if (jumpKey && !player.jumpHeld) {
        if (player.onGround) {
            player.vy = player.jumpForce; 
            player.onGround = false;
            for (let i = 0; i < 5; i++) {
                particles.push({ 
                    x: player.x + player.w / 2 + (Math.random() - 0.5) * 10, 
                    y: player.y + player.h, 
                    vx: (Math.random() - 0.5) * 3, 
                    vy: Math.random() * 2, 
                    life: 15, 
                    size: 2 + Math.random() * 2, 
                    color: '#888', 
                    gravity: 0.1 
                });
            }
        } else if (player.doubleJump) {
            player.vy = player.jumpForce * 0.9; 
            player.doubleJump = false;
            for (let i = 0; i < 8; i++) { 
                const a = (i / 8) * Math.PI * 2; 
                particles.push({ 
                    x: player.x + player.w / 2, 
                    y: player.y + player.h / 2, 
                    vx: Math.cos(a) * 3, 
                    vy: Math.sin(a) * 3, 
                    life: 20, 
                    size: 3, 
                    color: '#88ff88', 
                    gravity: 0 
                }); 
            }
        }
        player.jumpHeld = true;
    }
    if (!jumpKey) player.jumpHeld = false;
    if (!jumpKey && player.vy < -2 && !player.dashing) player.vy = -2;
    if (!player.dashing) { 
        player.vy += 0.5; 
        if (player.vy > 14) player.vy = 14; 
    }

    // 水平移動と衝突
    player.x += player.vx * slowMotion;
    const allPlatforms = [...lvl.platforms, ...movingPlatforms, ...disappearingPlatforms.filter(p => p.visible)];
    
    for (const p of allPlatforms) {
        if (rectCollision(player, p)) {
            if (player.vx > 0) player.x = p.x - player.w;
            else if (player.vx < 0) player.x = p.x + p.w;
            if (player.dashing) player.dashing = false;
        }
    }

    // 垂直移動と衝突
    player.y += player.vy * slowMotion;
    player.onGround = false;
    
    for (const p of allPlatforms) {
        if (rectCollision(player, p)) {
            if (player.vy > 0) { 
                player.y = p.y - player.h; 
                player.vy = 0; 
                player.onGround = true; 
                player.doubleJump = true;
                
                // 消える足場のトリガー
                if (disappearingPlatforms.includes(p)) {
                    p.touched = true;
                }
            }
            else if (player.vy < 0) { 
                player.y = p.y + p.h; 
                player.vy = 0; 
            }
        }
    }

    // スパイクとの衝突
    if (lvl.spikes) {
        for (const spike of lvl.spikes) {
            // スパイクの判定範囲を少し小さくする（見た目より甘く）
            const hitbox = {
                x: spike.x + 4,
                y: spike.y + (spike.dir === 'up' ? 5 : 0),
                w: spike.w - 8,
                h: spike.h - 5
            };
            if (rectCollision(player, hitbox)) {
                killPlayer();
            }
        }
    }

    // ギミック更新
    updateGimmicks();

    if (Math.abs(player.vx) > 0.1) player.runFrame += 0.3; 
    else player.runFrame = 0;

    // 画面外チェック
    if (player.y > GAME_HEIGHT + 50 || player.x < -50 || player.x > GAME_WIDTH + 50 || player.y < -100) { 
        killPlayer(); 
        clearKeysPressed(); 
        return; 
    }

    // ゴール判定
    if (rectCollision(player, { x: lvl.exitX, y: lvl.exitY, w: 30, h: 36 })) {
        if (!saveData.clearedStages.includes(currentLevel)) {
            saveData.clearedStages.push(currentLevel);
        }
        if (!saveData.bestDeaths[currentLevel] || deathCount < saveData.bestDeaths[currentLevel]) {
            saveData.bestDeaths[currentLevel] = deathCount;
        }
        saveData.totalDeaths += deathCount;
        saveSaveData();
        
        currentLevel++;
        if (currentLevel >= TOTAL_STAGES) {
            gameState = 'clear'; 
            clearTimer = 0;
            for (let i = 0; i < 200; i++) {
                particles.push({ 
                    x: player.x + player.w / 2, 
                    y: player.y + player.h / 2, 
                    vx: (Math.random() - 0.5) * 20, 
                    vy: (Math.random() - 0.5) * 20, 
                    life: 150 + Math.random() * 100, 
                    size: 2 + Math.random() * 8, 
                    color: ['#ff0', '#0ff', '#f0f', '#0f0', '#f80', '#fff'][Math.floor(Math.random() * 6)], 
                    gravity: 0.03 
                });
            }
        } else {
            deathCount = 0;
            resetLevel();
        }
    }

    if (flashEffect > 0) flashEffect--;
    updateParticles();
    prevTouchJump = touchState.jump; 
    prevTouchDash = touchState.dash;
    clearKeysPressed();
}

function updateParticles() {
    for (let i = bloodParticles.length - 1; i >= 0; i--) { 
        const p = bloodParticles[i]; 
        p.x += p.vx * slowMotion; 
        p.y += p.vy * slowMotion; 
        p.vy += p.gravity * slowMotion; 
        p.vx *= 0.99; 
        p.life--; 
        if (p.life <= 0) bloodParticles.splice(i, 1); 
    }
    for (let i = particles.length - 1; i >= 0; i--) { 
        const p = particles[i]; 
        p.x += p.vx; 
        p.y += p.vy; 
        p.vy += p.gravity || 0; 
        p.vx *= 0.98; 
        p.life--; 
        if (p.life <= 0) particles.splice(i, 1); 
    }
    for (let i = sparkParticles.length - 1; i >= 0; i--) { 
        const p = sparkParticles[i]; 
        p.x += p.vx; 
        p.y += p.vy; 
        p.vx *= 0.9; 
        p.vy *= 0.9; 
        p.life--; 
        if (p.life <= 0) sparkParticles.splice(i, 1); 
    }
    for (let i = textParticles.length - 1; i >= 0; i--) { 
        const p = textParticles[i]; 
        p.y += p.vy; 
        p.life--; 
        if (p.life <= 0) textParticles.splice(i, 1); 
    }
    for (let i = trailParticles.length - 1; i >= 0; i--) { 
        const p = trailParticles[i]; 
        p.life--; 
        p.size *= 0.9; 
        if (p.life <= 0) trailParticles.splice(i, 1); 
    }
    for (const s of backgroundStars) { 
        s.twinkle += 0.05; 
        s.y += s.speed; 
        if (s.y > GAME_HEIGHT) { 
            s.y = 0; 
            s.x = Math.random() * GAME_WIDTH; 
        } 
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.scale(scaleX, scaleY);
    
    if (screenShake > 0.5 && gameState !== 'dead') {
        ctx.translate((Math.random() - 0.5) * screenShake * 2, (Math.random() - 0.5) * screenShake * 2);
    }

    const lvl = levels[currentLevel] || levels[0];
    const g = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
    g.addColorStop(0, lvl.bgColor || '#0a0a1a'); 
    g.addColorStop(1, '#000015');
    ctx.fillStyle = g; 
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    
    // 背景の星
    for (const s of backgroundStars) {
        ctx.fillStyle = `rgba(255,255,255,${0.4 + Math.sin(s.twinkle) * 0.3})`;
        ctx.beginPath(); 
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); 
        ctx.fill();
    }

    if (gameState === 'title') { drawTitle(); ctx.restore(); drawTouchControls(); return; }
    if (gameState === 'stageSelect') { drawStageSelect(); ctx.restore(); drawTouchControls(); return; }
    if (gameState === 'clear') { drawClear(); ctx.restore(); drawTouchControls(); return; }

    // グリッド
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let i = 0; i < GAME_WIDTH; i += 32) { 
        ctx.beginPath(); 
        ctx.moveTo(i, 0); 
        ctx.lineTo(i, GAME_HEIGHT); 
        ctx.stroke(); 
    }
    for (let i = 0; i < GAME_HEIGHT; i += 32) { 
        ctx.beginPath(); 
        ctx.moveTo(0, i); 
        ctx.lineTo(GAME_WIDTH, i); 
        ctx.stroke(); 
    }

    // 軌跡パーティクル
    for (const p of trailParticles) { 
        ctx.fillStyle = p.color; 
        ctx.globalAlpha = p.life / 15; 
        ctx.beginPath(); 
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); 
        ctx.fill(); 
    } 
    ctx.globalAlpha = 1;

    // 足場描画
    for (const p of lvl.platforms) drawPlatform(p);
    for (const p of movingPlatforms) drawPlatform(p);
    for (const p of disappearingPlatforms) {
        if (p.visible) {
            ctx.globalAlpha = p.touched ? 0.5 + Math.sin(gameTime * 0.3) * 0.3 : 1;
            drawPlatform({ ...p, type: 'disappearing' });
            ctx.globalAlpha = 1;
        }
    }
    
    // 偽ブロック描画（普通の足場に見せる）
    if (lvl.fakeBlocks) {
        for (const fb of lvl.fakeBlocks) {
            if (!fb.falling || fb.y < GAME_HEIGHT) {
                drawPlatform({ ...fb, type: 'stone' });
            }
        }
    }
    
    // スパイク描画
    if (lvl.spikes) {
        for (const spike of lvl.spikes) {
            drawSpike(spike);
        }
    }
    
    // ジャンプパッド描画
    if (lvl.jumpPads) {
        for (const pad of lvl.jumpPads) {
            drawJumpPad(pad);
        }
    }
    
    // レーザー描画
    for (const l of lasers) {
        drawLaser(l);
    }
    
    // ノコギリ描画
    for (const s of sawBlades) {
        drawSawBlade(s);
    }
    
    // リンゴ描画
    for (const apple of apples) {
        drawApple(apple);
    }
    
    // 弾丸描画
    for (const b of bullets) {
        drawBullet(b);
    }
    
    // シューター描画
    if (lvl.shooters) {
        for (const s of lvl.shooters) {
            drawShooter(s);
        }
    }
    
    // 出口描画
    drawExit(lvl.exitX, lvl.exitY);
    
    // プレイヤー描画
    if (!player.dead) drawPlayer();

    // パーティクル描画
    for (const p of bloodParticles) { 
        ctx.fillStyle = p.color; 
        ctx.globalAlpha = Math.min(1, p.life / 30); 
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); 
    } 
    ctx.globalAlpha = 1;
    
    for (const p of particles) { 
        ctx.fillStyle = p.color; 
        ctx.globalAlpha = Math.min(1, p.life / 30); 
        ctx.beginPath(); 
        ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2); 
        ctx.fill(); 
    } 
    ctx.globalAlpha = 1;
    
    for (const p of sparkParticles) { 
        ctx.strokeStyle = p.color; 
        ctx.globalAlpha = p.life / 20; 
        ctx.lineWidth = 2; 
        ctx.beginPath(); 
        ctx.moveTo(p.x, p.y); 
        ctx.lineTo(p.x - p.vx * 3, p.y - p.vy * 3); 
        ctx.stroke(); 
    } 
    ctx.globalAlpha = 1;
    
    for (const p of textParticles) { 
        ctx.fillStyle = p.color; 
        ctx.globalAlpha = Math.min(1, p.life / 20); 
        ctx.font = `bold ${p.size}px monospace`; 
        ctx.textAlign = 'center'; 
        ctx.shadowColor = '#000'; 
        ctx.shadowBlur = 4; 
        ctx.fillText(p.text, p.x, p.y); 
        ctx.shadowBlur = 0; 
        ctx.textAlign = 'left'; 
    } 
    ctx.globalAlpha = 1;
    
    if (flashEffect > 0) { 
        ctx.fillStyle = `rgba(255,255,255,${flashEffect / 20})`; 
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT); 
    }

    drawHUD();
    if (gameState === 'dead') drawDeathScreen();
    ctx.restore();
    drawTouchControls();
}

function drawPlatform(p) {
    const type = p.type || 'stone'; 
    let c1, c2, c3;
    switch (type) {
        case 'grass': c1 = '#3d5c3d'; c2 = '#2d4c2d'; c3 = '#5d7c5d'; break;
        case 'stone': c1 = '#555'; c2 = '#444'; c3 = '#777'; break;
        case 'gold': c1 = '#aa8833'; c2 = '#997722'; c3 = '#ccaa55'; break;
        case 'disappearing': c1 = '#5555aa'; c2 = '#444488'; c3 = '#7777cc'; break;
        default: c1 = '#555'; c2 = '#444'; c3 = '#777';
    }
    ctx.fillStyle = c1; 
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = c3; 
    ctx.fillRect(p.x, p.y, p.w, 3);
    ctx.strokeStyle = '#222'; 
    ctx.lineWidth = 1; 
    ctx.strokeRect(p.x, p.y, p.w, p.h);
}

function drawSpike(spike) {
    const { x, y, w, h, dir } = spike;
    ctx.fillStyle = '#888';
    ctx.strokeStyle = '#aaa';
    ctx.lineWidth = 1;
    
    const spikeWidth = 12;
    const numSpikes = Math.floor(w / spikeWidth);
    
    for (let i = 0; i < numSpikes; i++) {
        const sx = x + i * spikeWidth + spikeWidth / 2;
        ctx.beginPath();
        if (dir === 'up') {
            ctx.moveTo(sx - spikeWidth / 2, y + h);
            ctx.lineTo(sx, y);
            ctx.lineTo(sx + spikeWidth / 2, y + h);
        } else if (dir === 'down') {
            ctx.moveTo(sx - spikeWidth / 2, y);
            ctx.lineTo(sx, y + h);
            ctx.lineTo(sx + spikeWidth / 2, y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
    }
}

function drawApple(apple) {
    const x = apple.x + 12;
    const y = apple.y + 12;
    
    // リンゴ本体（赤）
    ctx.fillStyle = '#ff2222';
    ctx.beginPath();
    ctx.arc(x, y, 12, 0, Math.PI * 2);
    ctx.fill();
    
    // ハイライト
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.arc(x - 3, y - 3, 4, 0, Math.PI * 2);
    ctx.fill();
    
    // 茎
    ctx.fillStyle = '#553300';
    ctx.fillRect(x - 1, y - 16, 3, 6);
    
    // 葉
    ctx.fillStyle = '#00aa00';
    ctx.beginPath();
    ctx.ellipse(x + 4, y - 13, 5, 3, Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();
}

function drawBullet(b) {
    ctx.fillStyle = '#ff0';
    ctx.shadowColor = '#ff0';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius || 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
}

function drawShooter(s) {
    ctx.fillStyle = '#444';
    ctx.strokeStyle = '#666';
    ctx.lineWidth = 2;
    
    let sx = s.x, sy = s.y - 15, sw = 20, sh = 30;
    if (s.dir === 'left') { sx = s.x - 20; }
    else if (s.dir === 'up') { sy = s.y - 20; sx = s.x - 15; sw = 30; sh = 20; }
    else if (s.dir === 'down') { sx = s.x - 15; sw = 30; sh = 20; }
    
    ctx.fillRect(sx, sy, sw, sh);
    ctx.strokeRect(sx, sy, sw, sh);
    
    // 砲口
    ctx.fillStyle = '#222';
    if (s.dir === 'right') {
        ctx.fillRect(sx + sw - 5, sy + sh/2 - 5, 8, 10);
    } else if (s.dir === 'left') {
        ctx.fillRect(sx - 3, sy + sh/2 - 5, 8, 10);
    }
}

function drawLaser(l) {
    if (l.active) {
        ctx.fillStyle = '#ff0000';
        ctx.shadowColor = '#ff0000';
        ctx.shadowBlur = 20;
        ctx.globalAlpha = 0.8 + Math.sin(gameTime * 0.3) * 0.2;
        ctx.fillRect(l.x, l.y, l.w, l.h);
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
    } else {
        ctx.fillStyle = '#330000';
        ctx.globalAlpha = 0.3;
        ctx.fillRect(l.x, l.y, l.w, l.h);
        ctx.globalAlpha = 1;
    }
}

function drawSawBlade(s) {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(gameTime * 0.2);
    
    // 外周
    ctx.fillStyle = '#888';
    ctx.beginPath();
    for (let i = 0; i < 12; i++) {
        const angle = (i / 12) * Math.PI * 2;
        const r = i % 2 === 0 ? s.radius : s.radius * 0.7;
        const px = Math.cos(angle) * r;
        const py = Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    
    // 中心
    ctx.fillStyle = '#444';
    ctx.beginPath();
    ctx.arc(0, 0, s.radius * 0.3, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.restore();
}

function drawJumpPad(pad) {
    const bounce = Math.sin(gameTime * 0.2) * 2;
    
    // 基盤
    ctx.fillStyle = '#aa8800';
    ctx.fillRect(pad.x, pad.y + 5, pad.w, pad.h - 5);
    
    // バネ部分
    ctx.fillStyle = '#ffcc00';
    ctx.fillRect(pad.x + 5, pad.y + bounce, pad.w - 10, 8);
    
    // 矢印
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(pad.x + pad.w/2, pad.y - 5 + bounce);
    ctx.lineTo(pad.x + pad.w/2 - 8, pad.y + 5 + bounce);
    ctx.lineTo(pad.x + pad.w/2 + 8, pad.y + 5 + bounce);
    ctx.closePath();
    ctx.fill();
}

function drawExit(x, y) {
    const t = gameTime * 0.05;
    for (let i = 3; i >= 0; i--) { 
        ctx.fillStyle = `rgba(0,${255 - i * 30},${255 - i * 30},${0.2 - i * 0.04})`; 
        ctx.beginPath(); 
        ctx.arc(x + 15, y + 18, 20 + i * 8 + Math.sin(t + i) * 3, 0, Math.PI * 2); 
        ctx.fill(); 
    }
    const glow = Math.sin(t * 2) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(0,255,255,${glow})`; 
    ctx.shadowColor = '#00ffff'; 
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.moveTo(x + 15, y); 
    ctx.lineTo(x + 30, y + 18); 
    ctx.lineTo(x + 22, y + 18);
    ctx.lineTo(x + 22, y + 36); 
    ctx.lineTo(x + 8, y + 36); 
    ctx.lineTo(x + 8, y + 18); 
    ctx.lineTo(x, y + 18);
    ctx.closePath(); 
    ctx.fill();
    ctx.shadowBlur = 0;
}

function drawPlayer() {
    const px = player.x, py = player.y, f = player.facing;
    const bobY = player.onGround ? Math.sin(player.runFrame) * 2 : 0;
    ctx.save();
    ctx.translate(px + player.w / 2, py + player.h / 2);
    if (player.dashing) { ctx.globalAlpha = 0.8; ctx.scale(1.5, 0.7); }
    ctx.translate(-(px + player.w / 2), -(py + player.h / 2));
    if (player.invincible > 0 && Math.floor(player.invincible / 3) % 2 === 0) ctx.globalAlpha = 0.5;
    
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; 
    ctx.beginPath(); 
    ctx.ellipse(px + player.w / 2, py + player.h + 2, 8, 3, 0, 0, Math.PI * 2); 
    ctx.fill();
    
    const cw = Math.sin(gameTime * 0.15) * 3;
    ctx.fillStyle = '#cc0000'; 
    ctx.beginPath();
    ctx.moveTo(px + (f > 0 ? 2 : 14), py + 6 + bobY);
    ctx.quadraticCurveTo(px + (f > 0 ? -8 : 24), py + 12 + cw + bobY, px + (f > 0 ? -4 : 20), py + 20 + cw + bobY);
    ctx.lineTo(px + (f > 0 ? 2 : 14), py + 18 + bobY); 
    ctx.fill();
    
    ctx.fillStyle = '#ff6688'; 
    ctx.fillRect(px + 2, py + 6 + bobY, 12, 10);
    ctx.fillStyle = '#ffccbb'; 
    ctx.fillRect(px + 2, py + bobY, 12, 8);
    ctx.fillStyle = '#553322'; 
    ctx.fillRect(px + 2, py + bobY, 12, 3);
    ctx.fillStyle = '#fff'; 
    ctx.fillRect(px + (f > 0 ? 8 : 4), py + 3 + bobY, 5, 4);
    ctx.fillStyle = '#000'; 
    ctx.fillRect(px + (f > 0 ? 10 : 4), py + 4 + bobY, 2, 2);
    
    const l1 = player.onGround ? Math.sin(player.runFrame) * 3 : 2;
    const l2 = player.onGround ? Math.sin(player.runFrame + Math.PI) * 3 : -2;
    ctx.fillStyle = '#4444ff'; 
    ctx.fillRect(px + 3 + l1, py + 15 + bobY, 4, 5); 
    ctx.fillRect(px + 9 + l2, py + 15 + bobY, 4, 5);
    ctx.fillStyle = '#666'; 
    ctx.fillRect(px + (f > 0 ? 12 : -4), py + 9 + bobY, 8, 4);
    ctx.restore();
}

function getRank(deaths) {
    for (const r of GAME_CONFIG.ranks) { 
        if (deaths <= r.maxDeaths) return r; 
    }
    return GAME_CONFIG.ranks[GAME_CONFIG.ranks.length - 1];
}

function drawHUD() {
    const lvl = levels[currentLevel]; 
    if (!lvl) return;
    
    // 難易度表示
    const diffInfo = getDifficultyInfo(currentLevel);
    ctx.fillStyle = diffInfo.color;
    ctx.font = 'bold 12px monospace';
    ctx.fillText(diffInfo.name, 10, 18);
    
    ctx.fillStyle = '#ff4444'; 
    ctx.font = 'bold 16px monospace'; 
    ctx.fillText('☠', 10, 40);
    ctx.fillStyle = '#fff'; 
    ctx.fillText(` ${deathCount}`, 28, 40);
    ctx.fillStyle = '#aaa'; 
    ctx.font = '12px monospace'; 
    ctx.fillText(`STAGE ${currentLevel + 1}/${TOTAL_STAGES}`, 10, 58);
    ctx.fillStyle = '#ffcc00'; 
    ctx.font = 'bold 14px monospace'; 
    ctx.fillText(lvl.name, 10, 78);
    
    const gaugeX = GAME_WIDTH - 70;
    ctx.fillStyle = player.dashCooldown > 0 ? '#444' : '#0ff'; 
    ctx.fillRect(gaugeX, 10, 50, 8);
    if (player.dashCooldown > 0) { 
        ctx.fillStyle = '#0ff'; 
        ctx.fillRect(gaugeX, 10, 50 * (1 - player.dashCooldown / 45), 8); 
    }
    ctx.fillStyle = '#888'; 
    ctx.font = '10px monospace'; 
    ctx.fillText('DASH', gaugeX, 30);
    ctx.fillStyle = player.doubleJump ? '#88ff88' : '#444'; 
    ctx.fillRect(gaugeX, 40, 50, 8);
    ctx.fillStyle = '#888'; 
    ctx.fillText('2JUMP', gaugeX, 60);
    if (!isMobile) { 
        ctx.fillStyle = '#666'; 
        ctx.fillText('ESC: Options', gaugeX - 10, 80); 
    }
}

function drawDeathScreen() {
    ctx.fillStyle = `rgba(80,0,0,${Math.min(0.6, deathTimer / 60)})`; 
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    
    if (deathTimer > 30) {
        if (isMobile) {
            ctx.fillStyle = 'rgba(100,100,100,0.8)';
            ctx.fillRect(GAME_WIDTH / 2 - 100, 30, 200, 50);
            ctx.strokeStyle = '#fff'; 
            ctx.lineWidth = 2;
            ctx.strokeRect(GAME_WIDTH / 2 - 100, 30, 200, 50);
            ctx.fillStyle = '#fff'; 
            ctx.font = 'bold 16px monospace'; 
            ctx.textAlign = 'center';
            ctx.fillText('RETURN TO MENU', GAME_WIDTH / 2, 62);
        }
        
        ctx.fillStyle = '#ff0000'; 
        ctx.shadowColor = '#ff0000'; 
        ctx.shadowBlur = 30; 
        ctx.font = 'bold 48px monospace'; 
        ctx.textAlign = 'center'; 
        ctx.fillText('GAME OVER', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 50); 
        ctx.shadowBlur = 0;
        
        ctx.fillStyle = '#ffaaaa'; 
        ctx.font = '20px monospace'; 
        ctx.textAlign = 'center'; 
        ctx.fillText(`Death Count: ${deathCount}`, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 10);
        
        if (Math.floor(gameTime / 30) % 2 === 0) {
            ctx.fillStyle = '#fff'; 
            ctx.font = '16px monospace';
            ctx.fillText(isMobile ? 'Tap anywhere to retry' : 'Press any key to retry', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 60);
        }
        ctx.textAlign = 'left';
    }
}

function drawTitle() {
    const t = gameTime * 0.02;
    for (let i = 0; i < 30; i++) { 
        ctx.fillStyle = `rgba(255,0,0,${0.1 + Math.sin(t + i) * 0.05})`; 
        ctx.beginPath(); 
        ctx.arc(Math.sin(t + i * 0.5) * GAME_WIDTH / 2 + GAME_WIDTH / 2, Math.cos(t * 0.7 + i * 0.3) * GAME_HEIGHT / 2 + GAME_HEIGHT / 2, 3 + Math.sin(t + i) * 2, 0, Math.PI * 2); 
        ctx.fill(); 
    }
    ctx.textAlign = 'center';
    ctx.save(); 
    ctx.translate(GAME_WIDTH / 2, GAME_HEIGHT * 0.18); 
    ctx.rotate(Math.sin(t * 0.5) * 0.02);
    ctx.fillStyle = '#ff0000'; 
    ctx.shadowColor = '#ff0000'; 
    ctx.shadowBlur = 30; 
    ctx.font = 'bold 28px monospace'; 
    ctx.fillText(GAME_CONFIG.title, 0, 0); 
    ctx.shadowBlur = 0; 
    ctx.restore();
    
    ctx.fillStyle = '#ff6666'; 
    ctx.font = 'bold 18px monospace'; 
    ctx.fillText(GAME_CONFIG.subtitle, GAME_WIDTH / 2, GAME_HEIGHT * 0.25);
    
    // 難易度説明
    ctx.font = '14px monospace';
    ctx.fillStyle = '#44ff44';
    ctx.fillText('NORMAL (1-5)', GAME_WIDTH / 2 - 150, GAME_HEIGHT * 0.35);
    ctx.fillStyle = '#ffaa00';
    ctx.fillText('HARD (6-13)', GAME_WIDTH / 2, GAME_HEIGHT * 0.35);
    ctx.fillStyle = '#ff4444';
    ctx.fillText('EXTREME (14-20)', GAME_WIDTH / 2 + 150, GAME_HEIGHT * 0.35);
    
    ctx.fillStyle = '#888'; 
    ctx.font = '12px monospace'; 
    ctx.fillText(`${TOTAL_STAGES} STAGES`, GAME_WIDTH / 2, GAME_HEIGHT * 0.42);
    const clearedCount = saveData.clearedStages.length;
    ctx.fillStyle = '#aaa'; 
    ctx.fillText(`Cleared: ${clearedCount}/${TOTAL_STAGES}`, GAME_WIDTH / 2, GAME_HEIGHT * 0.48);
    
    if (Math.sin(t * 4) > 0) { 
        ctx.fillStyle = '#fff'; 
        ctx.shadowColor = '#fff'; 
        ctx.shadowBlur = 10; 
        ctx.font = 'bold 16px monospace'; 
        ctx.fillText(isMobile ? 'TAP TO START' : 'PRESS Z / SPACE / ENTER', GAME_WIDTH / 2, GAME_HEIGHT * 0.58); 
        ctx.shadowBlur = 0; 
    }
    
    ctx.fillStyle = '#888'; 
    ctx.font = '12px monospace';
    if (isMobile) {
        ctx.fillText('Stick: Move | JUMP | DASH', GAME_WIDTH / 2, GAME_HEIGHT * 0.72);
    } else { 
        ctx.fillText('Arrow Keys: Move | Z/Space: Jump | X/Shift: Dash', GAME_WIDTH / 2, GAME_HEIGHT * 0.72); 
        ctx.fillText('R: Restart | Esc: Options', GAME_WIDTH / 2, GAME_HEIGHT * 0.77); 
    }
    ctx.textAlign = 'left';
}

function drawStageSelect() {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff4444'; 
    ctx.font = 'bold 28px monospace';
    ctx.fillText('STAGE SELECT', GAME_WIDTH / 2, 50);
    
    ctx.fillStyle = '#666'; 
    ctx.fillRect(20, 15, 80, 40);
    ctx.strokeStyle = '#888'; 
    ctx.lineWidth = 2; 
    ctx.strokeRect(20, 15, 80, 40);
    ctx.fillStyle = '#fff'; 
    ctx.font = '14px monospace'; 
    ctx.textAlign = 'center';
    ctx.fillText('< BACK', 60, 42);
    
    // 難易度ラベル
    const pageDiff = stageSelectPage === 0 ? 'NORMAL / HARD' : 'HARD / EXTREME';
    ctx.fillStyle = '#888';
    ctx.font = '12px monospace';
    ctx.fillText(pageDiff, GAME_WIDTH / 2, 80);
    
    if (!isMobile) {
        ctx.fillStyle = '#666'; 
        ctx.font = '12px monospace';
        ctx.fillText('Arrow Keys: Select | Z/Space/Enter: Start | Esc: Back', GAME_WIDTH / 2, 100);
    }
    
    const startX = 100, startY = 130, btnW = 120, btnH = 60, cols = 5;
    
    for (let i = 0; i < STAGES_PER_PAGE; i++) {
        const stageNum = stageSelectPage * STAGES_PER_PAGE + i;
        if (stageNum >= TOTAL_STAGES) break;
        const col = i % cols;
        const row = Math.floor(i / cols);
        const bx = startX + col * (btnW + 20);
        const by = startY + row * (btnH + 25);
        
        const isCleared = saveData.clearedStages.includes(stageNum);
        const isUnlocked = isStageUnlocked(stageNum);
        const isSelected = (stageNum === selectedStage);
        const diffInfo = getDifficultyInfo(stageNum);
        
        // 背景色（難易度別）
        if (isCleared) {
            ctx.fillStyle = stageNum < 5 ? '#225522' : (stageNum < 13 ? '#443311' : '#441122');
        } else if (isUnlocked) {
            ctx.fillStyle = stageNum < 5 ? '#223355' : (stageNum < 13 ? '#332233' : '#332222');
        } else {
            ctx.fillStyle = '#222';
        }
        ctx.fillRect(bx, by, btnW, btnH);
        
        // 難易度インジケーター
        ctx.fillStyle = diffInfo.color;
        ctx.fillRect(bx, by, 5, btnH);
        
        if (!isMobile && isSelected) {
            ctx.strokeStyle = '#ffff00'; 
            ctx.lineWidth = 4;
        } else {
            ctx.strokeStyle = isCleared ? '#44ff44' : (isUnlocked ? '#6666ff' : '#444'); 
            ctx.lineWidth = 2;
        }
        ctx.strokeRect(bx, by, btnW, btnH);
        
        ctx.fillStyle = isUnlocked ? '#fff' : '#555';
        ctx.font = 'bold 20px monospace'; 
        ctx.textAlign = 'center';
        ctx.fillText(`${stageNum + 1}`, bx + btnW / 2, by + 25);
        
        // ステージ名
        if (isUnlocked && levels[stageNum]) {
            ctx.fillStyle = '#888';
            ctx.font = '8px monospace';
            const shortName = levels[stageNum].name.substring(0, 12);
            ctx.fillText(shortName, bx + btnW / 2, by + 40);
        }
        
        if (isCleared) {
            ctx.fillStyle = '#88ff88'; 
            ctx.font = '10px monospace';
            ctx.fillText('★ CLEAR', bx + btnW / 2, by + 52);
            if (saveData.bestDeaths[stageNum] !== undefined) {
                ctx.fillStyle = '#aaa';
                ctx.fillText(`☠${saveData.bestDeaths[stageNum]}`, bx + btnW / 2, by + 62);
            }
        } else if (!isUnlocked) {
            ctx.fillStyle = '#555'; 
            ctx.font = '12px monospace';
            ctx.fillText('🔒', bx + btnW / 2, by + 45);
        }
    }
    
    ctx.fillStyle = '#aaa'; 
    ctx.font = '14px monospace'; 
    ctx.textAlign = 'center';
    const totalPages = Math.ceil(TOTAL_STAGES / STAGES_PER_PAGE);
    ctx.fillText(`Page ${stageSelectPage + 1}/${totalPages}`, GAME_WIDTH / 2, 460);
    
    if (stageSelectPage > 0) { 
        ctx.fillStyle = '#fff'; 
        ctx.fillText('◀ PREV', 150, 460); 
    }
    if ((stageSelectPage + 1) * STAGES_PER_PAGE < TOTAL_STAGES) { 
        ctx.fillStyle = '#fff'; 
        ctx.fillText('NEXT ▶', GAME_WIDTH - 150, 460); 
    }
    
    // 統計情報
    ctx.fillStyle = '#666'; 
    ctx.font = '12px monospace';
    ctx.fillText(`Total Deaths: ${saveData.totalDeaths} | Cleared: ${saveData.clearedStages.length}/${TOTAL_STAGES}`, GAME_WIDTH / 2, 500);
    
    // 難易度凡例
    ctx.font = '10px monospace';
    ctx.fillStyle = '#44ff44';
    ctx.fillText('■ NORMAL', GAME_WIDTH / 2 - 120, 530);
    ctx.fillStyle = '#ffaa00';
    ctx.fillText('■ HARD', GAME_WIDTH / 2, 530);
    ctx.fillStyle = '#ff4444';
    ctx.fillText('■ EXTREME', GAME_WIDTH / 2 + 120, 530);
    
    ctx.textAlign = 'left';
}

function drawClear() {
    const t = gameTime * 0.03;
    
    // 背景エフェクト
    for (let i = 0; i < 60; i++) { 
        ctx.fillStyle = `hsla(${(t * 50 + i * 20) % 360},100%,50%,0.15)`; 
        ctx.beginPath(); 
        ctx.arc(Math.sin(t + i) * GAME_WIDTH * 0.47 + GAME_WIDTH / 2, Math.cos(t * 0.8 + i * 0.5) * GAME_HEIGHT * 0.47 + GAME_HEIGHT / 2, 6 + Math.sin(t + i) * 4, 0, Math.PI * 2); 
        ctx.fill(); 
    }
    
    // パーティクル
    for (const p of particles) { 
        ctx.fillStyle = p.color; 
        ctx.globalAlpha = Math.min(1, p.life / 30); 
        ctx.beginPath(); 
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); 
        ctx.fill(); 
    } 
    ctx.globalAlpha = 1;
    
    ctx.textAlign = 'center';
    
    // タイトル
    ctx.save(); 
    ctx.translate(GAME_WIDTH / 2, GAME_HEIGHT * 0.12); 
    ctx.scale(1 + Math.sin(t * 2) * 0.05, 1 + Math.sin(t * 2) * 0.05);
    ctx.fillStyle = '#ffff00'; 
    ctx.shadowColor = '#ffff00'; 
    ctx.shadowBlur = 40; 
    ctx.font = 'bold 32px monospace'; 
    ctx.fillText('CONGRATULATIONS!', 0, 0); 
    ctx.shadowBlur = 0; 
    ctx.restore();
    
    ctx.fillStyle = '#fff'; 
    ctx.font = 'bold 24px monospace'; 
    ctx.fillText('YOU ARE THE GUY!', GAME_WIDTH / 2, GAME_HEIGHT * 0.22);
    
    // 統計
    ctx.fillStyle = '#aaa'; 
    ctx.font = '16px monospace';
    ctx.fillText(`Total Deaths: ${saveData.totalDeaths}`, GAME_WIDTH / 2, GAME_HEIGHT * 0.35);
    
    // 各難易度の死亡数
    let normalDeaths = 0, hardDeaths = 0, extremeDeaths = 0;
    for (let i = 0; i < 5; i++) {
        normalDeaths += saveData.bestDeaths[i] || 0;
    }
    for (let i = 5; i < 13; i++) {
        hardDeaths += saveData.bestDeaths[i] || 0;
    }
    for (let i = 13; i < 20; i++) {
        extremeDeaths += saveData.bestDeaths[i] || 0;
    }
    
    ctx.font = '12px monospace';
    ctx.fillStyle = '#44ff44';
    ctx.fillText(`NORMAL: ${normalDeaths} deaths`, GAME_WIDTH / 2 - 150, GAME_HEIGHT * 0.42);
    ctx.fillStyle = '#ffaa00';
    ctx.fillText(`HARD: ${hardDeaths} deaths`, GAME_WIDTH / 2, GAME_HEIGHT * 0.42);
    ctx.fillStyle = '#ff4444';
    ctx.fillText(`EXTREME: ${extremeDeaths} deaths`, GAME_WIDTH / 2 + 150, GAME_HEIGHT * 0.42);
    
    // ランク
    const rank = getRank(saveData.totalDeaths);
    ctx.fillStyle = rank.color; 
    ctx.shadowColor = rank.color; 
    ctx.shadowBlur = 20;
    ctx.font = 'bold 28px monospace';
    ctx.fillText(`RANK: ${rank.name}`, GAME_WIDTH / 2, GAME_HEIGHT * 0.55);
    ctx.shadowBlur = 0;
    
    // ランク一覧
    ctx.font = '10px monospace';
    ctx.fillStyle = '#666';
    ctx.fillText('RANKS: PERFECT(0) < THE GUY(50) < ALMOST(100) < KID(200) < BOY(350) < APPRENTICE(500)', GAME_WIDTH / 2, GAME_HEIGHT * 0.65);
    
    ctx.fillStyle = '#888'; 
    ctx.font = '12px monospace';
    ctx.fillText(`You conquered all ${TOTAL_STAGES} stages!`, GAME_WIDTH / 2, GAME_HEIGHT * 0.72);
    
    if (clearTimer > 60 && Math.sin(t * 4) > 0) {
        ctx.fillStyle = '#fff'; 
        ctx.font = '16px monospace';
        ctx.fillText(isMobile ? 'Tap for Title' : 'Press any key for Title', GAME_WIDTH / 2, GAME_HEIGHT * 0.82);
    }
    ctx.textAlign = 'left';
}

function gameLoop() {
    gameSpeedAccum += GAME_SPEED;
    while (gameSpeedAccum >= 1.0) { 
        update(); 
        gameSpeedAccum -= 1.0; 
    }
    draw();
    requestAnimationFrame(gameLoop);
}

function init() {
    loadKeyBindings();
    loadSaveData();
    resizeCanvas();
    resetLevel();
    gameLoop();
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}
</script>
</body>
</html>
